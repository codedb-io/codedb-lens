name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest   # Inno Setup is preinstalled; GoReleaser cross-builds Linux from here
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Sign checksums (Ed25519, verified by `codedb-lens update`)
        shell: pwsh
        run: |
          go run ./tools/sign dist/checksums.txt
          gh release upload "${{ github.ref_name }}" dist/checksums.txt.sig
        env:
          LENS_SIGNING_KEY: ${{ secrets.LENS_SIGNING_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build installer
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          $exe = (Get-ChildItem dist -Recurse -Filter codedb-lens.exe | Select-Object -First 1).FullName
          & "${env:ProgramFiles(x86)}\Inno Setup 6\iscc.exe" /DAppVersion=$v "/DSourceExe=$exe" build\windows\installer.iss
          gh release upload "${{ github.ref_name }}" dist\codedb-lens_windows_amd64_setup.exe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the Linux binaries from the draft release
        run: |
          for arch in amd64 arm64; do
            gh release download "${{ github.ref_name }}" -p "codedb-lens_linux_${arch}.tar.gz" -O - |
              (mkdir -p "bin/$arch" && tar -xz -C "bin/$arch" codedb-lens)
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/codedb-io/codedb-lens:${{ steps.v.outputs.version }}
            ghcr.io/codedb-io/codedb-lens:latest
