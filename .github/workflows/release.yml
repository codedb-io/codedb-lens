name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest   # Inno Setup is preinstalled; GoReleaser cross-builds Linux from here
    # LENS_SIGNING_KEY lives only in this environment, which needs a maintainer's approval and accepts only v* tags.
    environment: release
    permissions:
      contents: write
      id-token: write       # build provenance attestations (Sigstore)
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5
        with: { go-version-file: go.mod }
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a  # v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4 — for the image job: a draft release can't be fetched by tag
        with:
          name: linux-archives
          path: dist/codedb-lens_linux_*.tar.gz
      - name: Sign checksums (Ed25519, verified by `codedb-lens update`)
        shell: pwsh
        run: |
          go run ./tools/sign dist/checksums.txt
          gh release upload "${{ github.ref_name }}" dist/checksums.txt.sig
        env:
          LENS_SIGNING_KEY: ${{ secrets.LENS_SIGNING_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build installer
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          $exe = (Get-ChildItem dist -Recurse -Filter codedb-lens.exe | Select-Object -First 1).FullName
          & "${env:ProgramFiles(x86)}\Inno Setup 6\iscc.exe" /DAppVersion=$v "/DSourceExe=$exe" build\windows\installer.iss
          gh release upload "${{ github.ref_name }}" dist\codedb-lens_windows_amd64_setup.exe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The binaries are not code-signed yet: this proves they were built by this workflow from this repository.
      # Check with: gh attestation verify <file> --repo codedb-io/codedb-lens
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be  # v2
        with:
          subject-path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/checksums.txt
            dist/codedb-lens_windows_amd64_setup.exe

  image:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with: { name: linux-archives }
      - name: Unpack the Linux binaries
        run: |
          for arch in amd64 arm64; do
            mkdir -p "bin/$arch" && tar -xzf "codedb-lens_linux_${arch}.tar.gz" -C "bin/$arch" codedb-lens
          done
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130  # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/codedb-io/codedb-lens:${{ steps.v.outputs.version }}
            ghcr.io/codedb-io/codedb-lens:latest
