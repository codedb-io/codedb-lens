name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest   # Inno Setup is preinstalled; GoReleaser cross-builds Linux from here
    # LENS_SIGNING_KEY lives only in this environment, which needs a maintainer's approval and accepts only v* tags.
    environment: release
    permissions:
      contents: write
      id-token: write       # build provenance attestations (Sigstore)
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with: { go-version-file: go.mod }
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de  # v7.3.0
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v4 — for the image job: a draft release can't be fetched by tag
        with:
          name: linux-archives
          path: dist/codedb-lens_linux_*.tar.gz
      - name: Sign checksums (Ed25519, verified by `codedb-lens update`)
        shell: pwsh
        run: |
          go run ./tools/sign dist/checksums.txt
          gh release upload "${{ github.ref_name }}" dist/checksums.txt.sig
        env:
          LENS_SIGNING_KEY: ${{ secrets.LENS_SIGNING_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build installer
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          $exe = (Get-ChildItem dist -Recurse -Filter codedb-lens.exe | Select-Object -First 1).FullName
          & "${env:ProgramFiles(x86)}\Inno Setup 6\iscc.exe" /DAppVersion=$v "/DSourceExe=$exe" build\windows\installer.iss
          gh release upload "${{ github.ref_name }}" dist\codedb-lens_windows_amd64_setup.exe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The binaries are not code-signed yet: this proves they were built by this workflow from this repository.
      # Check with: gh attestation verify <file> --repo codedb-io/codedb-lens
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/checksums.txt
            dist/codedb-lens_windows_amd64_setup.exe

  image:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with: { name: linux-archives }
      - name: Unpack the Linux binaries
        run: |
          for arch in amd64 arm64; do
            mkdir -p "bin/$arch" && tar -xzf "codedb-lens_linux_${arch}.tar.gz" -C "bin/$arch" codedb-lens
          done
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/codedb-io/codedb-lens:${{ steps.v.outputs.version }}
            ghcr.io/codedb-io/codedb-lens:latest
