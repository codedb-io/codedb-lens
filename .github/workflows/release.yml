name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest   # Inno Setup is preinstalled; GoReleaser cross-builds Linux from here
    permissions:
      contents: write
      id-token: write       # build provenance attestations (Sigstore)
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4   # for the image job: a draft release can't be fetched by tag
        with:
          name: linux-archives
          path: dist/codedb-lens_linux_*.tar.gz
      - name: Sign checksums (Ed25519, verified by `codedb-lens update`)
        shell: pwsh
        run: |
          go run ./tools/sign dist/checksums.txt
          gh release upload "${{ github.ref_name }}" dist/checksums.txt.sig
        env:
          LENS_SIGNING_KEY: ${{ secrets.LENS_SIGNING_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build installer
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          $exe = (Get-ChildItem dist -Recurse -Filter codedb-lens.exe | Select-Object -First 1).FullName
          & "${env:ProgramFiles(x86)}\Inno Setup 6\iscc.exe" /DAppVersion=$v "/DSourceExe=$exe" build\windows\installer.iss
          gh release upload "${{ github.ref_name }}" dist\codedb-lens_windows_amd64_setup.exe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The binaries are not code-signed yet: this proves they were built by this workflow from this repository.
      # Check with: gh attestation verify <file> --repo codedb-io/codedb-lens
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/checksums.txt
            dist/codedb-lens_windows_amd64_setup.exe

  image:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: linux-archives }
      - name: Unpack the Linux binaries
        run: |
          for arch in amd64 arm64; do
            mkdir -p "bin/$arch" && tar -xzf "codedb-lens_linux_${arch}.tar.gz" -C "bin/$arch" codedb-lens
          done
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/codedb-io/codedb-lens:${{ steps.v.outputs.version }}
            ghcr.io/codedb-io/codedb-lens:latest
