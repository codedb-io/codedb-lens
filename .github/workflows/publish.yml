name: Publish

# After a release is published (drafts have no downloadable assets): update the Scoop manifest in bucket/ and
# send the new version to winget-pkgs.
on:
  release:
    types: [published]

jobs:
  scoop:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - name: Write bucket/codedb-lens.json
        env:
          TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          base="https://github.com/codedb-io/codedb-lens/releases/download/$TAG"
          hash=$(curl -fsSL "$base/checksums.txt" | awk '$2 == "codedb-lens_windows_amd64.zip" {print $1}')
          test -n "$hash"
          jq --arg v "${TAG#v}" --arg url "$base/codedb-lens_windows_amd64.zip" --arg hash "$hash" \
            '.version = $v | .architecture."64bit".url = $url | .architecture."64bit".hash = $hash' \
            bucket/codedb-lens.json > m.json && mv m.json bucket/codedb-lens.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket/codedb-lens.json
          git diff --cached --quiet || { git commit -m "Scoop: codedb-lens $TAG"; git push; }

  winget:
    runs-on: windows-latest
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}   # classic PAT, public_repo, of an account with a fork of winget-pkgs
    steps:
      - if: env.WINGET_TOKEN != ''
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: codeDB.Lens
          installers-regex: '_setup\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}
