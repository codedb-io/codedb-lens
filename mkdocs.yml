site_name: codeDB Lens
site_url: https://lens.codedb.com.br/
repo_url: https://github.com/codedb-io/codedb-lens
docs_dir: docs

theme:
  name: material
  logo: assets/icon.png
  favicon: assets/icon.png
  palette:
    - scheme: slate
      primary: blue
      accent: light blue
  features: [navigation.sections, content.code.copy]

plugins:
  - search
  - i18n:
      docs_structure: folder
      languages:
        - locale: en
          default: true
          name: English
        - locale: pt-BR
          name: Português (Brasil)
          nav_translations:
            Home: Início
            Permissions: Permissões
            Privacy: Privacidade
            Rules: Regras
            Getting started: Primeiros passos
            Why Windows shows a warning: Por que o Windows mostra um aviso
            Compare and free key: Comparação e chave grátis
            How the grade works: Como a nota é calculada

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Why Windows shows a warning: windows-warning.md
  - Compare and free key: compare.md
  - How the grade works: methodology.md
  - Permissions: permissions.md
  - Privacy: privacy.md
  - Roadmap: roadmap.md
  - Rules:
      - SQL Server:
          - MSSQL-AGENT-001: rules/mssql-agent-001.md
          - MSSQL-BACKUP-001: rules/mssql-backup-001.md
          - MSSQL-BLOCKING-001: rules/mssql-blocking-001.md
          - MSSQL-CHECKDB-001: rules/mssql-checkdb-001.md
          - MSSQL-CONFIG-001: rules/mssql-config-001.md
          - MSSQL-MISSINGIDX-001: rules/mssql-missingidx-001.md
          - MSSQL-REC-BLOCKING-001: rules/mssql-rec-blocking-001.md
          - MSSQL-REC-LONGQUERY-001: rules/mssql-rec-longquery-001.md
          - MSSQL-REC-WAITS-001: rules/mssql-rec-waits-001.md
          - MSSQL-REC-WORKERS-001: rules/mssql-rec-workers-001.md
          - MSSQL-SPACE-001: rules/mssql-space-001.md
          - MSSQL-TEMPDB-001: rules/mssql-tempdb-001.md
          - MSSQL-TOPQUERY-001: rules/mssql-topquery-001.md
          - MSSQL-UNUSEDIDX-001: rules/mssql-unusedidx-001.md
          - MSSQL-VERSION-001: rules/mssql-version-001.md
          - MSSQL-VERSION-002: rules/mssql-version-002.md
          - MSSQL-WAITS-001: rules/mssql-waits-001.md
      - PostgreSQL:
          - PG-AUTOVAC-001: rules/pg-autovac-001.md
          - PG-BLOAT-001: rules/pg-bloat-001.md
          - PG-CONN-001: rules/pg-conn-001.md
          - PG-INDEXES-001: rules/pg-indexes-001.md
          - PG-LOCKS-001: rules/pg-locks-001.md
          - PG-LONGTX-001: rules/pg-longtx-001.md
          - PG-PGSS-001: rules/pg-pgss-001.md
          - PG-REC-BLOCKING-001: rules/pg-rec-blocking-001.md
          - PG-REC-CONN-001: rules/pg-rec-conn-001.md
          - PG-REC-LONGQUERY-001: rules/pg-rec-longquery-001.md
          - PG-REC-WAITS-001: rules/pg-rec-waits-001.md
          - PG-SIZE-001: rules/pg-size-001.md
          - PG-SLOTS-001: rules/pg-slots-001.md
          - PG-TOPQUERY-001: rules/pg-topquery-001.md
          - PG-VERSION-001: rules/pg-version-001.md
          - PG-VERSION-002: rules/pg-version-002.md
          - PG-WRAPAROUND-001: rules/pg-wraparound-001.md

extra:
