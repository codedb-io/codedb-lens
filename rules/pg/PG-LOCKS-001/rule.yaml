id: PG-LOCKS-001
engine: pg
category: concurrency
severity: high
confidence: confirmed
permission: pg_monitor (pg_read_all_stats)
params:
  min_wait_s: 5   # sessions waiting on a lock for at least this long
title:
  en: Sessions blocked by locks right now
  pt-BR: Sessões bloqueadas por locks neste momento
impact:
  en: Blocked sessions wait for another session to release its locks. Users see timeouts, and a blocked DDL can queue every query behind it.
  pt-BR: Sessões bloqueadas esperam outra sessão liberar seus locks. Os usuários veem timeouts, e um DDL bloqueado pode enfileirar todas as consultas atrás dele.
next_action:
  en: Look at the blocker first. A blocker "idle in transaction" is usually an application that forgot to commit. Talk to its owner before pg_terminate_backend(pid).
  pt-BR: Olhe primeiro para quem bloqueia. Um bloqueador "idle in transaction" costuma ser uma aplicação que esqueceu o commit. Fale com o responsável antes de pg_terminate_backend(pid).
verify:
  en: "Re-run `SELECT pid, pg_blocking_pids(pid), wait_event FROM pg_stat_activity WHERE wait_event_type = 'Lock'`. It must come back empty (or with short waits) once the blocker commits, rolls back or is terminated. Repeat it in the busy hours: if the same application keeps blocking, the cause is in its transaction handling, not in this one session."
  pt-BR: "Rode de novo `SELECT pid, pg_blocking_pids(pid), wait_event FROM pg_stat_activity WHERE wait_event_type = 'Lock'`. O resultado deve vir vazio (ou com esperas curtas) quando o bloqueador der commit, rollback ou for encerrado. Repita nos horários de pico: se a mesma aplicação continua bloqueando, a causa está no tratamento de transações dela, não nessa sessão."
caveat:
  en: A snapshot only sees blocking happening at the moment of the check.
  pt-BR: Um retrato só vê bloqueios que estão acontecendo no momento da verificação.
saas_cta:
  en: codeDB catches lock chains as they happen, at any hour, and alerts you within minutes.
  pt-BR: O codeDB pega cadeias de locks na hora em que acontecem, a qualquer hora, e alerta em minutos.
