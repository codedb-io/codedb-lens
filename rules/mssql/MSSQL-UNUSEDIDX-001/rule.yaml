id: MSSQL-UNUSEDIDX-001
engine: mssql
category: indexes
severity: low
confidence: hint
scope: database
permission: VIEW SERVER STATE + VIEW ANY DEFINITION + CONNECT ANY DATABASE
params:
  min_writes: 1000   # unused index must cost at least this many writes since restart
title:
  en: Index candidates to review (unused or duplicate)
  pt-BR: Índices candidatos a revisão (não usados ou duplicados)
impact:
  en: Every index is updated on every insert, update and delete. Indexes nobody reads only slow writes down, take space and lengthen maintenance.
  pt-BR: Todo índice é atualizado em cada insert, update e delete. Índices que ninguém lê só deixam as escritas mais lentas, ocupam espaço e alongam a manutenção.
next_action:
  en: These are candidates to review, not drop recommendations. Check `observed_days` (the window these counters cover) and confirm over a full business cycle (month-end, reports) before dropping. Script the index first so it can be recreated, or disable it instead of dropping.
  pt-BR: São candidatos a revisão, não recomendações de remover. Veja `observed_days` (a janela que esses contadores cobrem) e confirme durante um ciclo completo do negócio (fechamento de mês, relatórios) antes de remover. Gere o script do índice antes, para poder recriá-lo, ou desabilite em vez de remover.
verify:
  en: "Before dropping, check the index in `sys.dm_db_index_usage_stats` (`user_seeks + user_scans + user_lookups` vs `user_updates`): zero reads over a full business cycle confirms it. After dropping or disabling, watch the application for a few days (slow queries, new missing index hints); if something regresses, recreate the index from the script you saved. Writes on the table should get cheaper."
  pt-BR: "Antes de remover, veja o índice em `sys.dm_db_index_usage_stats` (`user_seeks + user_scans + user_lookups` contra `user_updates`): zero leituras em um ciclo completo de negócio confirma. Depois de remover ou desabilitar, acompanhe a aplicação por alguns dias (consultas lentas, novas sugestões de índice faltando); se algo piorar, recrie o índice pelo script que você guardou. As escritas na tabela devem ficar mais baratas."
caveat:
  en: Usage statistics reset on restart and cover only `observed_days` days; an index used only by a month-end or yearly job can look unused in a short window. The longer the instance has been up, the more reliable this is. Replicas and readable secondaries have their own usage.
  pt-BR: As estatísticas de uso zeram no restart e cobrem só `observed_days` dias; um índice usado apenas por um job de fechamento de mês ou anual pode parecer sem uso numa janela curta. Quanto mais tempo a instância está no ar, mais confiável. Réplicas e secundárias legíveis têm uso próprio.
