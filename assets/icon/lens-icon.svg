<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0A0E17"/>
      <stop offset="100%" stop-color="#0D1524"/>
    </linearGradient>
    <linearGradient id="ring" x1="80" y1="80" x2="460" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4FA8FF"/>
      <stop offset="100%" stop-color="#1D5BE0"/>
    </linearGradient>
    <linearGradient id="bar" x1="160" y1="0" x2="284" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <radialGradient id="dot" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#BAE6FD"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </radialGradient>
    <clipPath id="clip"><rect width="512" height="512" rx="104"/></clipPath>
    <clipPath id="glass"><circle cx="222" cy="226" r="112"/></clipPath>
  </defs>

  <rect width="512" height="512" rx="104" fill="url(#bg)"/>
  <g clip-path="url(#clip)">
    <ellipse cx="256" cy="0" rx="250" ry="110" fill="#2563EB" opacity="0.16"/>

    <!-- Handle -->
    <line x1="318" y1="322" x2="408" y2="412" stroke="url(#ring)" stroke-width="58" stroke-linecap="round"/>
    <line x1="318" y1="322" x2="408" y2="412" stroke="#7DD3FC" stroke-width="58" stroke-linecap="round" opacity="0.12"/>

    <!-- Lens: dark glass + ring -->
    <circle cx="222" cy="226" r="112" fill="#0A0E17" opacity="0.95"/>
    <circle cx="222" cy="226" r="128" fill="none" stroke="url(#ring)" stroke-width="34"/>
    <circle cx="222" cy="226" r="145" fill="none" stroke="#7DD3FC" stroke-width="3" opacity="0.30"/>

    <g clip-path="url(#glass)">
      <!-- Database cylinder seen through the lens -->
      <ellipse cx="222" cy="174" rx="62" ry="19" fill="url(#bar)"/>
      <path d="M160 174 v36 a62 19 0 0 0 124 0 v-36 a62 19 0 0 1 -124 0 z" fill="url(#bar)" opacity="0.85"/>
      <path d="M160 218 v36 a62 19 0 0 0 124 0 v-36 a62 19 0 0 1 -124 0 z" fill="url(#bar)" opacity="0.6"/>
      <ellipse cx="222" cy="174" rx="62" ry="19" fill="#FFFFFF" opacity="0.10"/>
      <circle cx="260" cy="204" r="5" fill="#BAE6FD"/>
      <circle cx="260" cy="248" r="5" fill="#7DD3FC" opacity="0.8"/>

      <!-- Diagnostic pulse -->
      <polyline points="122,300 168,300 184,276 204,326 220,290 234,300 322,300"
        fill="none" stroke="#38BDF8" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Glass reflection -->
      <path d="M146 170 A90 90 0 0 1 206 128" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" opacity="0.18"/>
    </g>

    <!-- Status indicator (codeDB) -->
    <circle cx="430" cy="82" r="50" fill="#38BDF8" opacity="0.10"/>
    <circle cx="430" cy="82" r="26" fill="url(#dot)"/>
    <circle cx="422" cy="74" r="9" fill="#FFFFFF" opacity="0.4"/>
  </g>
</svg>
