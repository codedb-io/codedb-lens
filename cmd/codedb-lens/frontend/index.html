<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>codeDB Lens</title>
<style id="tokens"></style>
<style>
@font-face { font-family: Geist; src: url(fonts/Geist-400.ttf); font-weight: 400; }
@font-face { font-family: Geist; src: url(fonts/Geist-600.ttf); font-weight: 500 600; }
@font-face { font-family: Geist; src: url(fonts/Geist-700.ttf); font-weight: 700 800; }
@font-face { font-family: "Geist Mono"; src: url(fonts/GeistMono-400.ttf); font-weight: 400 600; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { font: var(--fs-md)/1.5 var(--font); color: var(--text); background: var(--bg); -webkit-font-smoothing: antialiased;
  display: grid; grid-template-columns: 272px minmax(0, 1fr); overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
[hidden] { display: none !important; }
svg.i { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* ── sidebar ─────────────────────────────── */
aside { background: var(--breu); color: var(--on-dark); display: flex; flex-direction: column; min-height: 0; }
.brand { display: flex; gap: var(--s3); align-items: center; padding: var(--s5) var(--s5) var(--s4); }
.brand { flex-direction: column; align-items: flex-start; gap: var(--s1); }
.brand img { width: 200px; height: auto; display: block; }
.brand small { color: var(--on-dark-muted); font-size: var(--fs-xs); }
.newbtn { margin: 0 var(--s4) var(--s4); display: flex; align-items: center; justify-content: center; gap: var(--s2); padding: 10px;
  border-radius: var(--r-md); border: 1px dashed rgb(255 90 31 / 40%); background: rgb(255 90 31 / 8%); color: var(--sinal-claro); cursor: pointer; font-weight: 600; }
.newbtn:hover { background: rgb(255 90 31 / 14%); }
.side-h { padding: 0 var(--s5) var(--s2); font-size: var(--fs-xs); letter-spacing: .08em; text-transform: uppercase; color: var(--on-dark-muted); }
.plist { flex: 1; overflow-y: auto; padding: 0 var(--s3); }
.pitem { width: 100%; display: grid; grid-template-columns: 34px 1fr auto; gap: var(--s3); align-items: center; text-align: left;
  padding: 10px var(--s3); margin-bottom: 2px; border: 0; border-radius: var(--r-md); background: transparent; cursor: pointer; color: var(--on-dark); }
.pitem:hover { background: var(--carvao); }
.pitem.sel { background: var(--grafite); box-shadow: inset 3px 0 0 var(--sinal); }
.pitem .nm { font-weight: 600; color: var(--papel); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pitem .sv { font-size: var(--fs-xs); color: var(--on-dark-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.eng { width: 34px; height: 34px; border-radius: var(--r-sm); display: grid; place-items: center; font: 700 11px var(--font); letter-spacing: .02em; }
.eng.e-mssql, .eng.e-pg { background: rgb(255 255 255 / 8%); color: var(--nuvem); }
.gbadge { min-width: 26px; height: 22px; padding: 0 6px; border-radius: var(--r-sm); display: grid; place-items: center; font-size: var(--fs-xs); font-weight: 700; color: var(--breu); }
.gbadge.g-F { color: #fff; }
.g-A { background: var(--ok); } .g-B { background: var(--grade-b); } .g-C { background: var(--med); } .g-D { background: var(--high); } .g-F { background: var(--crit); } .g-\? { background: var(--low); }
.pempty { padding: var(--s3) var(--s5); color: var(--on-dark-muted); font-size: var(--fs-sm); }
.side-foot { padding: var(--s4); display: grid; gap: var(--s3); border-top: 1px solid var(--grafite); }
.secure { display: flex; gap: var(--s3); padding: var(--s3); border-radius: var(--r-md); background: var(--carvao); border: 1px solid var(--grafite); font-size: var(--fs-xs); color: var(--on-dark-muted); }
.secure b { color: var(--papel); display: block; font-size: var(--fs-sm); margin-bottom: 2px; }
.secure svg { color: var(--ok); }
.secline { display: flex; gap: var(--s2); align-items: center; font-size: var(--fs-xs); color: var(--on-dark-muted); cursor: default; }
.secline svg { width: 14px; height: 14px; color: var(--ok); }
.acts .card.act { margin-top: 0; } /* beats .card + .card */
.side-row { display: flex; justify-content: space-between; align-items: center; font-size: var(--fs-xs); color: var(--on-dark-muted); }
.side-row select { background: var(--carvao); border: 1px solid var(--grafite); border-radius: var(--r-sm); padding: 4px 8px; color: var(--on-dark); }
.upd { padding: var(--s3); border-radius: var(--r-md); background: var(--sinal); color: var(--breu); font-size: var(--fs-xs); display: grid; gap: var(--s2); }
.upd .btn { background: #fff; color: var(--breu); border: 0; height: 30px; font-size: var(--fs-xs); }
.homebtn { margin: 0 var(--s4) var(--s2); display: flex; align-items: center; gap: var(--s2); padding: 8px var(--s3); border: 0; border-radius: var(--r-md);
  background: transparent; color: var(--on-dark); cursor: pointer; font-weight: 600; text-align: left; }
.homebtn:hover { background: var(--carvao); }
.homebtn.sel { background: var(--grafite); box-shadow: inset 3px 0 0 var(--sinal); }

/* ── main ─────────────────────────────────── */
main { overflow-y: auto; min-width: 0; }
.wrap { max-width: 1680px; margin: 0 auto; padding: var(--s6) clamp(var(--s4), 3vw, var(--s7)); }
.ph { display: flex; gap: var(--s4); align-items: flex-start; margin-bottom: var(--s5); }
.ph-ic { width: 48px; height: 48px; border-radius: var(--r-md); background: var(--breu); color: var(--sinal); display: grid; place-items: center; flex: none; }
.ph-ic svg { width: 26px; height: 26px; }
.ph h1 { margin: 0; font: 700 var(--fs-2xl)/1.2 var(--font-display); letter-spacing: -.01em; }
.ph p { margin: var(--s1) 0 0; color: var(--muted); }
.ph .hact { margin-left: auto; display: flex; gap: var(--s2); }
.grid { display: grid; grid-template-columns: minmax(0, 1fr) clamp(300px, 26vw, 380px); gap: var(--s5); align-items: start; }
@media (max-width: 1180px) { .grid { grid-template-columns: minmax(0, 1fr); } }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow-sm); }
.card + .card { margin-top: var(--s4); }
.sec { padding: var(--s5); }
.sec + .sec { border-top: 1px solid var(--line); }
.sh { display: flex; gap: var(--s3); align-items: flex-start; margin-bottom: var(--s4); }
.num { width: 28px; height: 28px; border-radius: 50%; background: var(--breu); color: var(--papel); display: grid; place-items: center; font: 600 var(--fs-sm) var(--mono); flex: none; }
.sh h2 { margin: 0; font-size: var(--fs-lg); }
.sh p { margin: 2px 0 0; color: var(--muted); font-size: var(--fs-sm); }
.sh .right { margin-left: auto; }

.engines { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: var(--s3); }
.etile { display: flex; gap: var(--s3); align-items: center; padding: var(--s4); border: 1.5px solid var(--line); border-radius: var(--r-md);
  background: var(--surface); cursor: pointer; text-align: left; transition: border-color .15s var(--ease), box-shadow .15s var(--ease); }
.etile:hover { border-color: var(--line-strong); }
.etile[aria-pressed="true"] { border-color: var(--sinal); box-shadow: var(--focus); background: var(--surface); }
.etile .eng { width: 44px; height: 44px; font-size: 13px; }
.etile .eng.e-mssql, .etile .eng.e-pg { background: var(--surface-2); color: var(--text-2); }
.etile b { display: block; font-size: var(--fs-lg); }
.etile small { color: var(--muted); font-size: var(--fs-xs); }

.fields { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: var(--s4) var(--s4); }
.f { display: flex; flex-direction: column; gap: 6px; grid-column: span 6; min-width: 0; }
.f.w8 { grid-column: span 8; } .f.w4 { grid-column: span 4; } .f.w12 { grid-column: span 12; }
@media (max-width: 760px) { .f, .f.w8, .f.w4 { grid-column: span 12; } }
.f > label { font-size: var(--fs-sm); font-weight: 600; color: var(--text-2); }
.f > label .req { color: var(--crit); }
.f .hint { font-size: var(--fs-xs); color: var(--muted); }
.ctl { display: flex; align-items: center; gap: var(--s2); border: 1px solid var(--line-strong); border-radius: var(--r-sm); background: var(--surface); padding: 0 var(--s3); height: 40px;
  transition: border-color .15s, box-shadow .15s; }
.ctl:focus-within { border-color: var(--sinal); box-shadow: var(--focus); }
.ctl svg { color: var(--muted); }
.ctl input, .ctl select { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; height: 100%; }
.ctl .eye { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: var(--fs-xs); padding: 4px; }
textarea.cs { width: 100%; min-height: 76px; border: 1px solid var(--line-strong); border-radius: var(--r-sm); padding: var(--s3); font: var(--fs-sm) var(--mono); resize: vertical; }
.seg { display: inline-flex; padding: 3px; border-radius: var(--r-md); background: var(--surface-2); border: 1px solid var(--line); gap: 2px; align-self: flex-start; }
.seg button { border: 0; background: transparent; padding: 7px 14px; border-radius: var(--r-sm); cursor: pointer; color: var(--muted); font-weight: 600; font-size: var(--fs-sm); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); }
.check { display: flex; gap: var(--s2); align-items: center; font-size: var(--fs-sm); color: var(--text-2); grid-column: span 12; cursor: pointer; }
.check input { width: 16px; height: 16px; accent-color: var(--sinal); }
.linkbtn { border: 0; background: none; color: var(--text); cursor: pointer; padding: 0; font-weight: 600; font-size: var(--fs-sm); display: inline-flex; gap: 6px; align-items: center; }
details.adv { margin-top: var(--s4); border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface-2); }
details.adv summary { cursor: pointer; padding: var(--s3) var(--s4); font-weight: 600; font-size: var(--fs-sm); color: var(--text-2); list-style: none; display: flex; gap: var(--s2); align-items: center; }
details.adv summary::-webkit-details-marker { display: none; }
details.adv summary::before { content: "›"; display: inline-block; transition: transform .15s; font-size: 18px; line-height: 1; }
details.adv[open] summary::before { transform: rotate(90deg); }
details.adv .fields { padding: 0 var(--s4) var(--s4); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--s2); height: 40px; padding: 0 var(--s4); border-radius: var(--r-sm);
  border: 1px solid var(--line-strong); background: var(--surface); cursor: pointer; font-weight: 600; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--sinal); border-color: var(--sinal); color: var(--breu); padding: 0 var(--s5); }
.btn.primary:hover { background: var(--sinal-claro); border-color: var(--sinal-claro); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.danger { color: var(--crit); border-color: var(--crit); }
.btn.danger:hover { background: var(--crit-bg); }
.btn:disabled { opacity: .55; cursor: default; }
.actions { display: flex; gap: var(--s3); flex-wrap: wrap; align-items: center; }
.actions .sp { flex: 1; }

.alert { display: flex; gap: var(--s3); padding: var(--s3) var(--s4); border-radius: var(--r-md); margin-bottom: var(--s4); font-size: var(--fs-sm); }
.alert b { display: block; }
.alert.ok { background: var(--ok-bg); color: #116b33; } .alert.err { background: var(--crit-bg); color: #9b1c1f; } .alert.info { background: var(--surface-2); color: var(--text-2); }
.alert details { margin-top: 4px; } .alert summary { cursor: pointer; opacity: .8; } .alert code { font: var(--fs-xs) var(--mono); word-break: break-word; }

/* rail */
.rail .card { padding: var(--s4) var(--s5); }
.rail h3 { margin: 0 0 var(--s3); font-size: var(--fs-md); display: flex; gap: var(--s2); align-items: center; }
.rail h3 svg { color: var(--muted); }
.rail .sub { color: var(--muted); font-size: var(--fs-xs); margin: -6px 0 var(--s3); }
.rules { max-height: 260px; overflow-y: auto; list-style: none; margin: 0; padding: 0; display: grid; gap: var(--s2); font-size: var(--fs-sm); }
.rules li { display: flex; gap: var(--s2); align-items: baseline; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; transform: translateY(-1px); background: var(--low); }
.dot.critical { background: var(--crit); } .dot.high { background: var(--high); } .dot.medium { background: var(--med); }
.hist { display: grid; gap: 6px; }
.hrow { display: grid; grid-template-columns: auto 1fr auto; gap: var(--s3); align-items: center; padding: 8px 10px; border-radius: var(--r-sm); border: 1px solid var(--line);
  background: var(--surface); cursor: pointer; text-align: left; font-size: var(--fs-sm); }
.hrow:hover { border-color: var(--line-strong); }
.hrow small { color: var(--muted); }
.hline { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--s3); align-items: center; }
.hline .linkbtn { color: var(--muted); font-weight: 400; font-size: var(--fs-xs); }
.hline .linkbtn:hover { color: var(--crit); }
/* home & tabs */
.tabs { display: flex; gap: var(--s1); border-bottom: 1px solid var(--line); margin-bottom: var(--s5); }
.tabs button { border: 0; background: none; padding: var(--s2) var(--s4); cursor: pointer; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--sinal); }
.soon { display: inline-block; white-space: nowrap; padding: 2px 8px; border-radius: var(--r-pill); background: var(--surface-2); border: 1px solid var(--line); font-size: var(--fs-xs); font-weight: 600; color: var(--muted); }
.how { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: var(--s4); }
.how h3 { margin: var(--s2) 0 var(--s1); font-size: var(--fs-md); }
.how p { margin: 0; color: var(--muted); font-size: var(--fs-sm); }
.acts { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: var(--s4); margin: var(--s5) 0; }
.act { display: flex; flex-direction: column; gap: var(--s2); align-items: flex-start; padding: var(--s5); text-align: left; cursor: pointer; border: 1.5px solid var(--line); }
.act:hover:not(:disabled) { border-color: var(--sinal); }
.act:disabled { cursor: default; opacity: .7; }
.act b { font-size: var(--fs-lg); }
.act span:not(.soon) { color: var(--muted); font-size: var(--fs-sm); }
.act svg { color: var(--text-2); width: 24px; height: 24px; }
.promo.hero { padding: var(--s5); gap: var(--s5); }
.promo.hero b { font: 700 var(--fs-xl) var(--font-display); margin-bottom: var(--s1); }
.promo.hero > div { font-size: var(--fs-sm); }
.promo.hero .btn { height: 40px; padding: 0 var(--s5); font-size: var(--fs-sm); }
.recstats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: var(--s3); margin: var(--s2) 0 var(--s3); }
.recstats > div { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-md); padding: var(--s3); }
.recstats .lbl { display: flex; align-items: center; color: var(--muted); font-size: var(--fs-xs); }
.recstats b { display: block; font: 700 var(--fs-xl) var(--font-display); margin-top: 2px; }
#recel { font-size: var(--fs-lg); white-space: nowrap; }
.bar { height: 6px; background: var(--line); border-radius: var(--r-pill); overflow: hidden; margin-top: var(--s2); }
.bar i { display: block; height: 100%; width: 0; background: var(--sinal); transition: width .4s; }
.infobtn { display: inline-grid; place-items: center; width: 16px; height: 16px; margin-left: 6px; padding: 0; border: 1px solid var(--line-strong); border-radius: 50%;
  background: var(--surface); color: var(--muted); font: 600 10px/1 var(--font); cursor: pointer; }
.infobtn:hover, .infobtn:focus-visible { color: var(--text); border-color: var(--sinal); outline: none; box-shadow: var(--focus); }
.pop { max-width: min(420px, calc(100vw - 32px)); padding: var(--s4); border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface);
  color: var(--text); box-shadow: var(--shadow-md); font-size: var(--fs-sm); line-height: 1.55; }
.pop::backdrop { background: rgb(10 12 17 / 18%); }
.promo-t { transition: opacity .4s var(--ease); }
.promo-t.fade { opacity: 0; }
.code { background: var(--breu); color: var(--on-dark); border-radius: var(--r-md); padding: var(--s3) var(--s4); font: 12px/1.6 var(--mono); white-space: pre-wrap; word-break: break-word; }
.promo { background: var(--breu); color: var(--papel); border-radius: var(--r-md); display: flex; gap: var(--s3); align-items: center; padding: var(--s3); }
.promo > div { flex: 1; min-width: 0; font-size: var(--fs-xs); color: var(--on-dark); }
.promo b { display: block; color: var(--papel); font-size: var(--fs-sm); }
.promo .btn { background: var(--sinal); color: var(--breu); border: 0; height: 30px; padding: 0 var(--s3); font-size: var(--fs-xs); }
.promo.mini { flex-direction: column; align-items: stretch; gap: var(--s2); } .promo.mini .btn { width: 100%; }
.promo.wide { margin: 0; border-radius: 0; padding: var(--s3) var(--s5); }

/* run view */
.run { max-width: 760px; }
.prog { height: 6px; border-radius: var(--r-pill); background: var(--line); overflow: hidden; margin: var(--s4) 0 var(--s5); }
.prog i { display: block; height: 100%; width: 0; background: var(--sinal); transition: width .3s var(--ease); }
.steps { list-style: none; padding: 0; margin: 0; display: grid; gap: var(--s2); }
.steps li { display: grid; grid-template-columns: 24px 1fr auto; gap: var(--s3); align-items: center; padding: var(--s3) var(--s4); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); }
.steps .st { font-size: var(--fs-xs); font-weight: 600; color: var(--muted); }
.steps .ic { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; color: #fff; background: var(--line-strong); }
.steps li.running .ic { background: none; border: 2px solid var(--sinal); border-top-color: transparent; animation: spin 0.8s linear infinite; }
.steps li.ok .ic { background: var(--ok); } .steps li.finding .ic { background: var(--high); } .steps li.no_data .ic { background: var(--low); }
@keyframes spin { to { transform: rotate(360deg); } }
.view { position: fixed; inset: 0 0 0 272px; display: flex; flex-direction: column; background: var(--bg); }
.vbar { display: flex; gap: var(--s2); align-items: center; padding: var(--s3) var(--s5); background: var(--surface); border-bottom: 1px solid var(--line); }
.vbar .sp { flex: 1; }
.view iframe { flex: 1; width: 100%; border: 0; }
/* free key */
.keychip { display: flex; gap: var(--s2); align-items: center; width: 100%; padding: 8px 10px; border-radius: var(--r-sm); border: 1px solid rgb(255 255 255 / 18%);
  background: rgb(255 255 255 / 6%); color: #fff; cursor: pointer; font-size: var(--fs-xs); text-align: left; }
.keychip:hover { background: rgb(255 255 255 / 12%); }
.keychip svg { color: var(--sinal-claro); }
.consent { display: grid; gap: var(--s3); margin: var(--s4) 0; }
.consent .check { align-items: flex-start; }
.consent a { color: var(--text); text-decoration-color: var(--sinal); text-underline-offset: 2px; }
.notice { font-size: var(--fs-xs); color: var(--muted); margin: 0 0 var(--s4); }
/* AI (MCP) */
#mcpview h3 { margin: 0 0 var(--s2); font-size: var(--fs-md); }
.flow { display: flex; flex-wrap: wrap; gap: var(--s2); align-items: center; font-size: var(--fs-sm); }
.flow span { padding: var(--s2) var(--s3); border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface-2); font-weight: 600; }
.flow i { color: var(--muted); font-style: normal; }
.cmd { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--s3); align-items: start; margin-top: var(--s3); }
.mclient + .mclient { border-top: 1px solid var(--line); margin-top: var(--s4); padding-top: var(--s4); }
.mstat { display: flex; gap: var(--s3); align-items: center; }
.pill { padding: 2px 8px; border-radius: var(--r-pill); font-size: var(--fs-xs); font-weight: 600; background: var(--surface-2); border: 1px solid var(--line); color: var(--muted); }
.pill.on { background: var(--ok-bg); color: #116b33; border-color: transparent; } .pill.warn { background: var(--crit-bg); color: #9b1c1f; border-color: transparent; }
.qs { display: grid; gap: var(--s2); } .qs h4 { margin: var(--s2) 0 0; font-size: var(--fs-sm); color: var(--muted); }
.qrow { display: flex; gap: var(--s3); justify-content: space-between; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--r-sm); font-size: var(--fs-sm); }
.mcpprof { display: grid; gap: var(--s2); margin: var(--s3) 0; } .mcpprof small { color: var(--muted); }
.plist-ul { margin: 0; padding-left: 1.2em; color: var(--text-2); font-size: var(--fs-sm); display: grid; gap: var(--s1); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">

<aside>
  <div class="brand"><img src="logo.svg" alt="codeDB Lens"><small id="ver"></small></div>
  <button class="homebtn" id="homebtn"><svg class="i"><use href="#i-home"/></svg><span data-t="gui_home"></span></button>
  <button class="homebtn" id="mcpbtn"><svg class="i"><use href="#i-ai"/></svg><span data-t="gui_mcp_nav"></span></button>
  <button class="newbtn" id="new"><svg class="i"><use href="#i-plus"/></svg><span data-t="gui_new_title"></span></button>
  <div class="side-h" data-t="gui_connections"></div>
  <div class="plist" id="plist"></div>
  <div class="side-foot">
    <div class="upd" id="upd" hidden><span id="updmsg"></span><button type="button" class="btn" id="updbtn" hidden data-t="gui_update_now"></button></div>
    <button type="button" class="keychip" id="keychip"><svg class="i"><use href="#i-key"/></svg><span id="keylbl"></span></button>
    <div class="promo mini"><div><b class="promo-t"></b></div><button type="button" class="btn promo-cta" data-t="gui_promo_cta"></button></div>
    <div class="secline" data-tt="gui_secure"><svg class="i"><use href="#i-shield"/></svg><span data-t="gui_secure_title"></span></div>
    <div class="side-row">
      <a href="#" id="powered" style="color:var(--nuvem);text-decoration:none">Powered by codeDB</a>
      <select id="uilang" aria-label="Language"><option value="en">English</option><option value="pt-BR">Português</option></select>
    </div>
  </div>
</aside>

<main id="main">
<div class="wrap" id="home">
  <div class="ph"><div class="ph-ic"><svg class="i"><use href="#i-db"/></svg></div>
    <div><h1 data-t="gui_home_title"></h1><p data-t="gui_home_sub"></p></div></div>
  <div class="card sec">
    <div class="sh"><div><h2 data-t="gui_how"></h2></div></div>
    <div class="how">
      <div><span class="num">1</span><h3 data-t="gui_how_1"></h3><p data-t="gui_how_1s"></p></div>
      <div><span class="num">2</span><h3 data-t="gui_how_2"></h3><p data-t="gui_how_2s"></p></div>
      <div><span class="num">3</span><h3 data-t="gui_how_3"></h3><p data-t="gui_how_3s"></p></div>
    </div>
    <div class="secure" style="margin-top:var(--s5);background:var(--surface-2);border-color:var(--line);color:var(--muted)"><svg class="i"><use href="#i-shield"/></svg>
      <div><b style="color:var(--text)" data-t="gui_secure_title"></b><span data-t="gui_secure"></span></div></div>
  </div>
  <div class="acts">
    <button type="button" class="card act" id="actnew"><svg class="i"><use href="#i-plus"/></svg><b data-t="gui_new_title"></b><span data-t="gui_card_new_s"></span></button>
    <button type="button" class="card act" id="actrun"><svg class="i"><use href="#i-play"/></svg><b data-t="gui_card_run"></b><span data-t="gui_card_run_s"></span></button>
    <button type="button" class="card act" id="actrec"><svg class="i"><use href="#i-rec"/></svg><b data-t="gui_card_record"></b><span data-t="gui_card_record_s"></span></button>
    <button type="button" class="card act" id="actmcp"><svg class="i"><use href="#i-ai"/></svg><b data-t="gui_card_mcp"></b><span id="actmcps"></span></button>
  </div>
  <div class="promo hero"><div><b data-t="gui_codedb_title"></b><span data-t="gui_codedb_text"></span><br><span data-t="gui_promo"></span>
    <br><button type="button" class="linkbtn" id="homekey" style="color:var(--sinal-claro);margin-top:var(--s3)"><svg class="i"><use href="#i-key"/></svg><span></span></button></div>
    <button type="button" class="btn" id="homecta" data-t="gui_promo_cta"></button></div>
</div>

<div class="wrap" id="editor" hidden>
  <div class="ph">
    <div class="ph-ic"><svg class="i"><use href="#i-db"/></svg></div>
    <div><h1 id="title"></h1><p id="subtitle"></p></div>
    <div class="hact">
      <button class="btn" id="dup" hidden data-t="gui_duplicate"></button>
      <button class="btn danger" id="del" hidden data-t="gui_delete"></button>
    </div>
  </div>

  <div class="tabs" id="tabs" role="tablist" hidden>
    <button type="button" role="tab" data-tab="check" data-t="gui_tab_check"></button>
    <button type="button" role="tab" data-tab="record" data-t="gui_tab_record"></button>
    <button type="button" role="tab" data-tab="hist" data-t="gui_history"></button>
  </div>

  <div id="tab-record" style="max-width:760px" hidden>
    <div class="card sec">
      <div class="sh"><svg class="i" style="color:var(--sinal)"><use href="#i-rec"/></svg><div><h2 data-t="gui_card_record"></h2><p data-t="gui_rec_sub"></p></div></div>
      <div id="recstatus"></div>
      <div id="recidle">
        <div class="seg" id="recdur"><button type="button" data-h="1" aria-pressed="true" data-t="gui_rec_1h"></button><button type="button" data-h="24" data-t="gui_rec_24h"></button></div>
        <p class="hint" id="reckey" hidden><button type="button" class="linkbtn" id="reckeybtn"><svg class="i"><use href="#i-key"/></svg><span data-t="gui_rec_24h_key"></span></button></p>
        <div class="actions" style="margin-top:var(--s4)"><button type="button" class="btn primary" id="recstart"><svg class="i"><use href="#i-rec"/></svg><span data-t="gui_rec_start"></span></button></div>
      </div>
      <div id="reclive" hidden>
        <div class="recstats">
          <div><span class="lbl"><span data-t="gui_rec_elapsed"></span><i data-info="gui_rec_info_elapsed"></i></span><b id="recel"></b><div class="bar"><i id="recbar"></i></div></div>
          <div><span class="lbl"><span data-t="gui_rec_samples"></span><i data-info="gui_rec_info_samples"></i></span><b id="recsm"></b></div>
          <div><span class="lbl"><span data-t="gui_rec_gaps"></span><i data-info="gui_rec_info_gaps"></i></span><b id="recgp"></b></div>
          <div><span class="lbl"><span data-t="gui_rec_size"></span><i data-info="gui_rec_info_size"></i></span><b id="recsz"></b></div>
        </div>
        <p class="hint" data-t="gui_rec_keep_open"></p>
        <div class="actions"><button type="button" class="btn danger" id="recstop" data-t="gui_rec_stop"></button><span class="sp"></span>
          <button type="button" class="btn" id="recnow" data-t="gui_rec_report"></button></div>
      </div>
      <div style="margin-top:var(--s5);padding-top:var(--s4);border-top:1px solid var(--line)">
        <button type="button" class="linkbtn" id="reccopy"><svg class="i"><use href="#i-paste"/></svg><span data-t="gui_rec_copy"></span></button>
        <p class="hint" data-t="gui_rec_copy_hint"></p>
      </div>
    </div>
    <div class="card sec" style="margin-top:var(--s4)"><h3 style="margin:0 0 var(--s3)" data-t="gui_rec_list"></h3><div class="hist" id="reclist"></div></div>
  </div>

  <div class="card sec" id="tab-hist" style="max-width:760px" hidden><div class="hist" id="hist"></div></div>

  <div class="grid" id="tab-check">
    <form id="f" autocomplete="off" onsubmit="return false">
      <div class="card">
        <div class="sec">
          <div class="engines" role="group">
            <button type="button" class="etile" data-engine="mssql"><span class="eng e-mssql">SQL</span><span><b>SQL Server</b><small data-t="gui_mssql_sub"></small></span></button>
            <button type="button" class="etile" data-engine="pg"><span class="eng e-pg">PG</span><span><b>PostgreSQL</b><small data-t="gui_pg_sub"></small></span></button>
          </div>
        </div>

        <div class="sec">
          <div class="sh"><span class="num">1</span><div><h2 data-t="gui_step_server"></h2><p data-t="gui_step_server_sub"></p></div>
            <button type="button" class="linkbtn right" id="pastebtn" aria-expanded="false" aria-controls="pastebox"><svg class="i"><use href="#i-paste"/></svg><span id="pastelbl" data-t="gui_paste"></span></button></div>
          <div id="pastebox" hidden style="margin-bottom:var(--s4)">
            <textarea class="cs" id="cs" spellcheck="false" placeholder="Server=sql01,1433;Database=app;User Id=lens;Password=…   |   postgres://lens@pg01:5432/app"></textarea>
            <div class="actions" style="margin-top:var(--s2)"><button type="button" class="btn" id="csapply" data-t="gui_paste_apply"></button><span id="csmsg" class="hint"></span></div>
          </div>
          <div class="fields">
            <div class="f w8"><label for="server"><span data-t="gui_server"></span> <span class="req">*</span></label>
              <div class="ctl"><svg class="i"><use href="#i-server"/></svg><input id="server" name="server" placeholder="sql01.corp.local · sql01\INSTANCE"></div></div>
            <div class="f w4"><label for="port" data-t="gui_port"></label>
              <div class="ctl"><input id="port" name="port" type="number" min="1" max="65535" placeholder="1433"></div></div>
            <div class="f"><label for="name" data-t="gui_name"></label>
              <div class="ctl"><svg class="i"><use href="#i-tag"/></svg><input id="name" name="name" placeholder="Produção · SQL01"></div>
              <span class="hint" data-t="gui_name_hint"></span></div>
            <div class="f"><label for="database" data-t="gui_database"></label>
              <div class="ctl"><svg class="i"><use href="#i-db"/></svg><input id="database" name="database" placeholder="master"></div></div>
          </div>
        </div>

        <div class="sec">
          <div class="sh"><span class="num">2</span><div><h2 data-t="gui_step_auth"></h2><p data-t="gui_step_auth_sub"></p></div></div>
          <div class="fields">
            <div class="f w12 mssql"><div class="seg" id="authseg">
              <button type="button" data-auth="windows" data-t="gui_auth_win"></button><button type="button" data-auth="sql" data-t="gui_auth_sql"></button></div></div>
            <div class="f cred"><label for="user" data-t="gui_user"></label>
              <div class="ctl"><svg class="i"><use href="#i-user"/></svg><input id="user" name="user" placeholder="codedb_lens"></div></div>
            <div class="f cred"><label for="password" data-t="gui_password"></label>
              <div class="ctl"><svg class="i"><use href="#i-lock"/></svg><input id="password" name="password" type="password"><button type="button" class="eye" id="eye" data-t="gui_show"></button></div>
              <span class="hint" id="pwhint" hidden data-t="gui_pw_saved"></span></div>
          </div>
          <details class="adv">
            <summary data-t="gui_advanced"></summary>
            <div class="fields">
              <label class="check mssql"><input type="checkbox" name="trust" id="trust"><span data-t="gui_trust"></span></label>
              <div class="f pg"><label for="sslmode" data-t="gui_sslmode"></label>
                <div class="ctl"><select id="sslmode" name="sslmode"><option value="">prefer</option><option>disable</option><option>require</option><option>verify-ca</option><option>verify-full</option></select></div></div>
              <div class="f"><label for="lang" data-t="gui_lang"></label>
                <div class="ctl"><select id="lang" name="lang"><option value="en">English</option><option value="pt-BR">Português (Brasil)</option></select></div></div>
              <div class="f"><label for="mcp_max_rows"><span data-t="gui_mcp_rows"></span><i data-info="gui_mcp_rows_info"></i></label>
                <div class="ctl"><input id="mcp_max_rows" name="mcp_max_rows" type="number" min="1" max="10000" placeholder="500"></div></div>
              <div class="f"><label for="mcp_timeout_s"><span data-t="gui_mcp_timeout"></span><i data-info="gui_mcp_timeout_info"></i></label>
                <div class="ctl"><input id="mcp_timeout_s" name="mcp_timeout_s" type="number" min="1" max="120" placeholder="10"></div></div>
              <div class="f w12"><label for="out_dir" data-t="gui_out"></label>
                <div class="ctl"><svg class="i"><use href="#i-folder"/></svg><input id="out_dir" name="out_dir"></div></div>
            </div>
          </details>
        </div>

        <div class="sec">
          <div class="sh"><span class="num">3</span><div><h2 data-t="gui_step_run"></h2><p data-t="gui_step_run_sub"></p></div></div>
          <div id="status"></div>
          <div class="actions">
            <button type="button" class="btn" id="test"><svg class="i"><use href="#i-plug"/></svg><span data-t="gui_test"></span></button>
            <button type="button" class="btn" id="save" data-t="gui_save"></button>
            <span class="sp"></span>
            <button type="button" class="btn primary" id="run"><svg class="i"><use href="#i-play"/></svg><span data-t="gui_run"></span></button>
          </div>
        </div>
      </div>
    </form>

    <div class="rail">
      <div class="card"><h3><svg class="i"><use href="#i-list"/></svg><span data-t="gui_checks"></span></h3><p class="sub" id="checksn"></p><ul class="rules" id="rules"></ul></div>
      <div class="card"><h3><svg class="i"><use href="#i-key"/></svg><span data-t="gui_perms"></span><button type="button" class="linkbtn" id="copy" style="margin-left:auto" data-t="gui_copy"></button></h3><div class="code" id="permtext"></div></div>
    </div>
  </div>
</div>

<div class="wrap" id="keyview" hidden>
  <div class="ph"><div class="ph-ic"><svg class="i"><use href="#i-key"/></svg></div>
    <div><h1 data-t="gui_key_title"></h1><p data-t="gui_key_sub"></p></div>
    <button class="btn" id="keyback" style="margin-left:auto" data-t="gui_back"></button></div>
  <div class="grid">
    <form id="kf" autocomplete="off" onsubmit="return false">
      <div class="card"><div class="sec">
        <div id="keystatus"></div>
        <p class="notice" data-t="reg_intro"></p>
        <div class="fields">
          <div class="f"><label for="rname"><span data-t="reg_name"></span> <span class="req">*</span></label><div class="ctl"><input id="rname" maxlength="200"></div></div>
          <div class="f"><label for="remail"><span data-t="reg_email"></span> <span class="req">*</span></label><div class="ctl"><input id="remail" type="email" maxlength="254"></div></div>
          <div class="f"><label for="rcompany" data-t="reg_company"></label><div class="ctl"><input id="rcompany" maxlength="200"></div></div>
          <div class="f"><label for="rrole" data-t="reg_role"></label><div class="ctl"><select id="rrole"></select></div></div>
          <div class="f"><label for="rinst" data-t="reg_instances"></label><div class="ctl"><select id="rinst"></select></div></div>
        </div>
        <div class="consent">
          <label class="check"><input type="checkbox" id="rprivacy"><span><span id="lprivacy"></span> (<a href="#" id="privlink">↗</a>) <span class="req">*</span></span></label>
          <label class="check"><input type="checkbox" id="rmkt"><span id="lmkt"></span></label>
        </div>
        <p class="notice" id="rnotice"></p>
        <div class="actions"><span class="sp"></span><button type="button" class="btn primary" id="rsend" disabled data-t="gui_key_send"></button></div>
      </div></div>
    </form>
    <div class="rail">
      <div class="card" id="renewcard" hidden><h3><svg class="i"><use href="#i-key"/></svg><span data-t="gui_key_renew"></span></h3>
        <p class="notice" data-t="lic_renew_sent"></p>
        <label class="check" id="renewack" hidden><input type="checkbox" id="rrenewack"><span><span id="lrenewack"></span> (<a href="#" id="privlink2">↗</a>)</span></label>
        <div class="actions" style="margin-top:var(--s2)"><span class="sp"></span><button type="button" class="btn primary" id="rrenew" data-t="gui_key_renew"></button></div></div>
      <div class="card"><h3><svg class="i"><use href="#i-paste"/></svg><span data-t="gui_key_have"></span></h3>
        <textarea class="cs" id="rtoken" spellcheck="false" placeholder="eyJ2Ijox…"></textarea>
        <div class="actions" style="margin-top:var(--s2)"><button type="button" class="btn" id="rimport" data-t="gui_key_import"></button>
          <span class="sp"></span><button type="button" class="btn ghost" id="rremove" hidden data-t="gui_key_remove"></button></div></div>
    </div>
  </div>
</div>

<div class="wrap" id="mcpview" hidden>
  <div class="ph"><div class="ph-ic"><svg class="i"><use href="#i-ai"/></svg></div>
    <div><h1 data-t="gui_mcp_title"></h1><p data-t="gui_mcp_sub"></p></div></div>
  <div class="secure" style="max-width:860px;margin-bottom:var(--s5);background:var(--surface-2);border-color:var(--line);color:var(--muted);align-items:center"><svg class="i"><use href="#i-shield"/></svg>
    <b style="color:var(--text);margin:0" data-t="gui_mcp_readonly"></b><i data-info="gui_mcp_info_provider"></i></div>
  <div class="alert err" id="mcpwrite" style="max-width:860px" hidden><div><b id="mcpwritemsg"></b>
    <button type="button" class="linkbtn" id="mcpwritedoc" style="color:inherit;text-decoration:underline" data-t="gui_mcp_write_doc"></button></div></div>
  <div class="tabs" id="mcptabs" role="tablist" style="max-width:860px">
    <button type="button" role="tab" data-mtab="guide" data-t="gui_mcp_tab_guide"></button>
    <button type="button" role="tab" data-mtab="setup" data-t="gui_mcp_tab_setup"></button>
  </div>
  <div class="card" id="mtab-guide" style="max-width:860px">
    <div class="sec"><div class="sh"><span class="num">1</span><div><h2 data-t="gui_mcp_guide_1"></h2><p data-t="gui_mcp_guide_1s"></p></div></div>
      <div class="flow"><span data-t="gui_mcp_flow_client"></span><i>→</i><span data-t="gui_mcp_flow_lens"></span><i>→</i><span data-t="gui_mcp_flow_db"></span></div></div>
    <div class="sec"><div class="sh"><span class="num">2</span><div><h2 data-t="gui_mcp_guide_2"></h2><p data-t="gui_mcp_guide_2s"></p></div></div>
      <div class="how"><div><h3 data-t="gui_mcp_diag"></h3><p data-t="gui_mcp_diag_s"></p></div>
        <div><h3 data-t="gui_mcp_data"></h3><p data-t="gui_mcp_data_s"></p><button type="button" class="linkbtn" id="mcpdata" style="margin-top:var(--s2)" data-t="gui_mcp_data_link"></button></div></div></div>
    <div class="sec"><div class="sh"><span class="num">3</span><div><h2 data-t="gui_mcp_guide_3"></h2><p data-t="gui_mcp_guide_3s"></p></div></div>
      <div class="seg" id="mcpclients"></div><div id="mcpone"></div></div>
    <div class="sec"><div class="sh"><span class="num">4</span><div><h2 data-t="gui_mcp_guide_4"></h2><p data-t="gui_mcp_guide_4s"></p></div></div>
      <div class="qs"></div></div>
    <div class="sec"><div class="sh"><span class="num">5</span><div><h2 data-t="gui_mcp_guide_5"></h2><p data-t="gui_mcp_guide_5s"></p></div></div></div>
    <div class="sec"><div class="sh"><span class="num">6</span><div><h2 data-t="gui_mcp_guide_6"></h2></div></div>
      <ul class="plist-ul"><li data-t="gui_mcp_p1"></li><li data-t="gui_mcp_p2"></li><li data-t="gui_mcp_p3"></li></ul>
      <button type="button" class="linkbtn" id="mcpfull" style="margin-top:var(--s4)" data-t="gui_mcp_full"></button></div>
  </div>
  <div id="mtab-setup" style="max-width:860px" hidden>
    <div class="card sec"><h3 data-t="gui_mcp_profiles"></h3><p class="hint" style="margin:0" data-t="gui_mcp_profiles_s"></p>
      <div class="mcpprof" id="mcpprofiles"></div>
      <label class="check"><input type="checkbox" id="mcpredact"><span data-t="gui_mcp_redact"></span></label></div>
    <div class="card sec"><h3 data-t="gui_mcp_clients"></h3><div id="mcpstatus"></div></div>
    <div class="card sec"><h3 data-t="gui_mcp_examples"></h3><div class="qs"></div></div>
  </div>

<script>
const $ = s => document.querySelector(s), $$ = s => document.querySelectorAll(s), api = () => window.go.main.App;
const PERMS = {
  mssql: "CREATE LOGIN codedb_lens WITH PASSWORD = '<senha>';\nGRANT VIEW SERVER STATE TO codedb_lens;\nGRANT VIEW ANY DEFINITION TO codedb_lens;\nGRANT CONNECT ANY DATABASE TO codedb_lens;\nUSE msdb;\nCREATE USER codedb_lens FOR LOGIN codedb_lens;\nALTER ROLE db_datareader ADD MEMBER codedb_lens;\nALTER ROLE SQLAgentReaderRole ADD MEMBER codedb_lens;",
  pg: "CREATE ROLE codedb_lens LOGIN PASSWORD '<senha>';\nGRANT pg_monitor TO codedb_lens;\nGRANT CONNECT ON DATABASE app TO codedb_lens;"
};
let key = {}, state, texts = {}, uiLang = 'en', current = null, engine = 'mssql', auth = 'windows', lastPath = '', lastProfile = null, histCache = {};

const t = k => texts[k] || k;
const tf = (k, ...a) => a.reduce((s, v) => s.replace(/%[sd]/, v), t(k));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function applyTexts() {
  $$('[data-t]').forEach(e => e.textContent = t(e.dataset.t)); $$('[data-tt]').forEach(e => e.title = t(e.dataset.tt));
  $$('button.infobtn').forEach(b => b.setAttribute('aria-label', t('tl_what')));
}
function ago(iso) {
  const s = (new Date(iso) - Date.now()) / 1000, rtf = new Intl.RelativeTimeFormat(uiLang, { numeric: 'auto' });
  for (const [u, n] of [['day', 86400], ['hour', 3600], ['minute', 60]]) if (Math.abs(s) >= n) return rtf.format(Math.round(s / n), u);
  return rtf.format(Math.round(s), 'second');
}

/* ── form state ── */
function setEngine(e) {
  engine = e;
  $$('.etile').forEach(b => b.setAttribute('aria-pressed', b.dataset.engine === e));
  $('#port').placeholder = e === 'pg' ? '5432' : '1433';
  $('#database').placeholder = e === 'pg' ? 'postgres' : 'master';
  $('#permtext').textContent = PERMS[e];
  toggle(); loadRules();
}
function setAuth(a) { auth = a; $$('#authseg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.auth === a)); toggle(); }
function toggle() {
  const ms = engine === 'mssql';
  $$('.mssql').forEach(e => e.hidden = !ms);
  $$('.pg').forEach(e => e.hidden = ms);
  $$('.cred').forEach(e => e.hidden = ms && auth === 'windows');
}
function profileFromForm() {
  const v = id => $('#' + id).value.trim();
  return { name: v('name') || v('server'), lang: $('#lang').value, out_dir: v('out_dir'),
    mcp_max_rows: +v('mcp_max_rows') || 0, mcp_timeout_s: +v('mcp_timeout_s') || 0, conn: {
    engine, server: v('server'), port: +v('port') || 0, database: v('database'), auth: engine === 'mssql' ? auth : '',
    user: v('user'), trust_server_cert: $('#trust').checked, sslmode: $('#sslmode').value } };
}
function fill(p) {
  current = p ? p.name : null;
  const c = (p && p.conn) || { engine: 'mssql', auth: 'windows', server: '' };
  for (const [id, val] of [['name', p ? p.name : ''], ['server', c.server || ''], ['port', c.port || ''], ['database', c.database || ''],
    ['user', c.user || ''], ['password', ''], ['out_dir', (p && p.out_dir) || ''], ['sslmode', c.sslmode || ''], ['lang', (p && p.lang) || uiLang],
    ['mcp_max_rows', (p && p.mcp_max_rows) || ''], ['mcp_timeout_s', (p && p.mcp_timeout_s) || '']]) $('#' + id).value = val;
  $('#trust').checked = !!c.trust_server_cert;
  setAuth(c.auth || (c.engine === 'mssql' ? 'windows' : 'sql'));
  setEngine(c.engine || 'mssql');
  $('#pwhint').hidden = !p; $('#del').hidden = !p; $('#dup').hidden = !p; $('#tabs').hidden = !p;
  $('#title').textContent = p ? p.name : t('gui_new_title');
  $('#subtitle').textContent = p ? t('gui_edit_sub') : t('gui_new_sub');
  show('editor'); setTab('check'); setPaste(false); status(); renderList(); renderHistory(p);
}
function show(id) {
  ['home', 'editor', 'keyview', 'runner', 'view', 'mcpview'].forEach(v => $('#' + v).hidden = v !== id);
  $('#homebtn').classList.toggle('sel', id === 'home'); $('#mcpbtn').classList.toggle('sel', id === 'mcpview');
}
function setTab(name) {
  $$('#tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === name));
  for (const n of ['check', 'record', 'hist']) $('#tab-' + n).hidden = n !== name;
  if (name === 'record') loadRecordings();
}

/* ── record tab ── */
let rec = {}, recHours = 1;
const mb = n => n >= 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB';
const hm = s => { s = Math.max(0, Math.round(s)); const p = n => String(n).padStart(2, '0'); return Math.floor(s / 3600) + ':' + p(Math.floor(s % 3600 / 60)) + ':' + p(s % 60); };
function recStatus(kind, msg, detail) {
  $('#recstatus').innerHTML = kind ? '<div class="alert ' + kind + '"><div><b>' + esc(msg) + '</b>' + (detail ? '<details><summary>' + esc(t('gui_details')) + '</summary><code>' + esc(detail) + '</code></details>' : '') + '</div></div>' : '';
}
function renderRec() {
  const mine = rec.profile && rec.profile === current, live = mine && rec.running;
  $('#recidle').hidden = live; $('#reclive').hidden = !live;
  $('#reckey').hidden = !!key.valid; $$('#recdur button')[1].disabled = !key.valid;
  if (!key.valid && recHours === 24) setHours(1);
  if (live) {
    const start = new Date(rec.started || Date.now()), end = new Date(rec.deadline || Date.now()), total = (end - start) / 1000 || 1, el = (Date.now() - start) / 1000;
    $('#recel').textContent = rec.started ? hm(el) + ' / ' + hm(total) : '–';
    $('#recbar').style.width = rec.started ? Math.min(100, el / total * 100) + '%' : '0';
    $('#recsm').textContent = rec.samples || 0; $('#recgp').textContent = rec.gaps || 0; $('#recsz').textContent = mb(rec.bytes || 0);
    if (!rec.started) recStatus('info', t('gui_rec_connecting'));
    else if (!rec.connected) recStatus('err', tf('gui_rec_down', rec.last_error || ''));
    else recStatus('info', tf('gui_rec_running', end.toLocaleString(uiLang)));
  } else if (mine && rec.error && !rec.stop) recStatus('err', friendly(rec.error), rec.error);
  else if (mine && rec.stop) recStatus(rec.error ? 'err' : 'ok', tf('gui_rec_done', t('rec_stop_' + rec.stop)), rec.error);
  else recStatus();
  $('#recstart').disabled = !!rec.running;
}
function setHours(h) { recHours = h; $$('#recdur button').forEach(b => b.setAttribute('aria-pressed', +b.dataset.h === h)); }
async function loadRecordings() {
  rec = await api().Recording(); renderRec();
  const p = (state.profiles || []).find(x => x.name === current), box = $('#reclist');
  const list = p ? await api().Recordings(p) || [] : [];
  box.innerHTML = list.length ? '' : '<p class="sub" style="margin:0">' + esc(t('gui_rec_none')) + '</p>';
  list.forEach(r => {
    const line = document.createElement('div'); line.className = 'hline';
    const b = document.createElement('button'); b.type = 'button'; b.className = 'hrow';
    const s = new Date(r.started), e = r.stopped ? new Date(r.stopped) : null;
    b.innerHTML = '<svg class="i" style="color:var(--sinal)"><use href="#i-rec"/></svg><span>' + esc(s.toLocaleString(uiLang)) + '<br><small>' +
      esc(e ? hm((e - s) / 1000) + ' · ' + t('rec_stop_' + r.stop) : t('gui_rec_live')) + '</small></span><small>' + esc(t('gui_rec_report')) + ' ›</small>';
    b.onclick = () => recReport(r.dir, p);
    const f = document.createElement('button'); f.type = 'button'; f.className = 'linkbtn'; f.textContent = t('gui_rec_folder');
    f.onclick = () => api().OpenFolder(r.dir + '\\meta.json');
    line.append(b, f); box.appendChild(line);
  });
}
async function recReport(dir, p) {
  try { const r = await api().RecordingReport(dir, uiLang); showReport(r.html, r.path, p); }
  catch (e) { recStatus('err', friendly(e), String(e)); }
}
async function startRec() {
  let p; try { p = await save(); } catch (e) { recStatus('err', String(e)); return; }
  if (!p) { setTab('check'); return; }
  $('#recstart').disabled = true; rec = { running: true, profile: p.name }; renderRec();
  try { await api().StartRecording({ ...p, lang: uiLang }, '', recHours); }
  catch (e) { rec = {}; renderRec(); recStatus('err', friendly(e), String(e)); }
}
function onRec(ev) {
  const ended = rec.running && !ev.running;
  rec = ev;
  if (current === ev.profile && !$('#tab-record').hidden) { renderRec(); if (ended) loadRecordings(); }
}
function recCommand(p) { // what to run on the server; the password stays out of it (CODEDB_LENS_PASSWORD)
  const c = p.conn, q = v => /[\s"\\]/.test(v) ? '"' + v.replace(/"/g, '\\"') + '"' : v;
  const a = ['codedb-lens record', '--engine ' + c.engine, '--server ' + q(c.server)];
  if (c.port) a.push('--port ' + c.port);
  if (c.database) a.push('--database ' + q(c.database));
  if (c.engine === 'mssql' && c.auth === 'windows') a.push('--auth windows'); else if (c.user) a.push('--user ' + q(c.user));
  if (c.trust_server_cert) a.push('--trust-server-cert');
  if (c.sslmode) a.push('--sslmode ' + c.sslmode);
  a.push('--duration ' + (key.valid ? '24h' : '1h'));
  return a.join(' ');
}
/* ── "i" buttons: native popover (click, keyboard, Esc), text from the i18n key in data-info ── */
let infoN = 0;
function applyInfo() {
  $$('i[data-info]').forEach(el => {
    const id = 'info-' + (++infoN), b = document.createElement('button'), pop = document.createElement('div');
    b.type = 'button'; b.className = 'infobtn'; b.textContent = 'i'; b.setAttribute('popovertarget', id); b.setAttribute('aria-label', t('tl_what'));
    pop.id = id; pop.className = 'pop'; pop.popover = 'auto'; pop.dataset.t = el.dataset.info; pop.textContent = t(el.dataset.info);
    el.replaceWith(b, pop);
  });
}
function goHome() { current = null; show('home'); renderList(); }

/* ── AI (MCP): status and commands to copy; installing stays on the command line (Q48) ── */
let mcpClient = 'claude-desktop', mcpSel = [], mcpGuide = [], mcpSt = [];
const QS = { gui_mcp_diag: ['gui_mcp_q_diag_1', 'gui_mcp_q_diag_2'], gui_mcp_data: ['gui_mcp_q_data_1', 'gui_mcp_q_data_2', 'gui_mcp_q_data_3'] };
const docs = page => 'https://lens.codedb.com.br/' + (uiLang === 'pt-BR' ? 'pt-BR/' : '') + page + '/';
const copyBtn = text => '<button type="button" class="linkbtn" data-copy="' + esc(text) + '">' + esc(t('gui_copy')) + '</button>';
async function loadMCP() {
  [mcpGuide, mcpSt] = await Promise.all([api().MCPGuide(mcpSel, $('#mcpredact').checked), api().MCPStatus()]);
  mcpGuide = mcpGuide || []; mcpSt = mcpSt || []; renderMCP();
}
function mcpBlock(g, withStatus) {
  const st = mcpSt.find(s => s.client === g.client) || {}, k = st.configured ? (st.missing ? 'warn' : 'on') : '';
  return (withStatus ? '<div class="mstat"><b>' + esc(g.name) + '</b><span class="pill ' + k + '">' + esc(t(k === 'warn' ? 'gui_mcp_missing' : k ? 'gui_mcp_on' : 'gui_mcp_off')) + '</span></div>' : '') +
    '<div class="cmd"><div class="code">' + esc(g.command) + '</div>' + copyBtn(g.command) + '</div>' +
    '<p class="hint">' + esc(g.client === 'claude-code' ? t('gui_mcp_cc_note') : tf('gui_mcp_restart', g.name)) + '</p>' +
    (g.snippet ? '<details class="adv"><summary>' + esc(t('gui_mcp_manual')) + '</summary><div class="cmd" style="padding:0 var(--s4) var(--s4)"><div class="code">' +
      esc(g.snippet) + '</div>' + copyBtn(g.snippet) + '</div></details>' : '');
}
function renderMCP() {
  $('#mcpclients').innerHTML = mcpGuide.map(g => '<button type="button" data-client="' + esc(g.client) + '" aria-pressed="' + (g.client === mcpClient) + '">' + esc(g.name) + '</button>').join('');
  const g = mcpGuide.find(x => x.client === mcpClient); $('#mcpone').innerHTML = g ? mcpBlock(g, false) : '';
  $('#mcpstatus').innerHTML = mcpGuide.map(g => '<div class="mclient">' + mcpBlock(g, true) + '</div>').join('');
  const ps = state.profiles || [];
  $('#mcpprofiles').innerHTML = ps.length ? ps.map(p => '<label class="check"><input type="checkbox" value="' + esc(p.name) + '"' + (mcpSel.includes(p.name) ? ' checked' : '') + '><span>' +
    esc(p.name) + ' <small>' + esc(p.conn.server) + '</small></span></label>').join('') : '<p class="hint" style="margin:0">' + esc(t('gui_no_conn')) + '</p>';
  const qs = Object.entries(QS).map(([h, ks]) => '<h4>' + esc(t(h)) + '</h4>' + ks.map(k => '<div class="qrow"><span>' + esc(t(k)) + '</span>' + copyBtn(t(k)) + '</div>').join('')).join('');
  $$('#mcpview .qs').forEach(b => b.innerHTML = qs);
  const w = ps.filter(p => p.mcp_write).map(p => p.name); // a security alert, not a feature: no way to turn it on here
  $('#mcpwrite').hidden = !w.length; $('#mcpwritemsg').textContent = tf('gui_mcp_write_on', w.join(', '));
  const on = mcpSt.filter(s => s.configured && !s.missing).map(s => s.name);
  $('#actmcps').textContent = on.length ? tf('gui_mcp_configured_in', on.join(', ')) : t('gui_card_mcp_s');
}
function setMTab(name) {
  $$('#mcptabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.mtab === name));
  $('#mtab-guide').hidden = name !== 'guide'; $('#mtab-setup').hidden = name !== 'setup';
}
async function showMCP(tab) {
  current = null; renderList(); show('mcpview'); await loadMCP();
  setMTab(tab || (mcpSt.some(s => s.configured) ? 'setup' : 'guide')); // first visit: the guide
}

/* ── codeDB call to action: rotating phrases, each tagged so the SaaS can tell which one converts ── */
const PROMOS = 6;
let promo = Math.floor(Math.random() * PROMOS) + 1, promoHover = false;
function landing(campaign, content) {
  const u = new URL(state.landing); u.searchParams.set('utm_campaign', campaign);
  if (content) u.searchParams.set('utm_content', content);
  return u.toString();
}
function renderPromo() { $$('.promo-t').forEach(e => e.textContent = t('gui_promo_' + promo)); }
setInterval(() => {
  if (promoHover || document.hidden) return;
  $$('.promo-t').forEach(e => e.classList.add('fade'));
  setTimeout(() => { promo = promo % PROMOS + 1; renderPromo(); $$('.promo-t').forEach(e => e.classList.remove('fade')); }, 400);
}, 20000);
function setPaste(open) {
  $('#pastebox').hidden = !open; $('#pastebtn').setAttribute('aria-expanded', open);
  const l = $('#pastelbl'); l.dataset.t = open ? 'gui_paste_hide' : 'gui_paste'; l.textContent = t(l.dataset.t);
  if (open) $('#cs').focus();
}
function showReport(html, path, p) {
  lastPath = path; lastProfile = p; show('view');
  const f = $('#frame'); // reports carry both languages: open them in the app's, whatever the run used
  f.onload = () => { try { const h = f.contentDocument.documentElement; h.dataset.lang = h.lang = uiLang; } catch (e) {} };
  f.srcdoc = html;
}

/* ── sidebar & rail ── */
function renderList() {
  const box = $('#plist'); box.innerHTML = '';
  const ps = state.profiles || [];
  if (!ps.length) { box.innerHTML = '<div class="pempty">' + esc(t('gui_no_conn')) + '</div>'; return; }
  ps.forEach(p => {
    const last = (histCache[p.name] || [])[0];
    const b = document.createElement('button');
    b.className = 'pitem' + (p.name === current ? ' sel' : '');
    b.innerHTML = '<span class="eng e-' + esc(p.conn.engine) + '">' + (p.conn.engine === 'pg' ? 'PG' : 'SQL') + '</span>' +
      '<span style="min-width:0"><div class="nm">' + esc(p.name) + '</div><div class="sv">' + esc(p.conn.server) + (last ? ' · ' + esc(ago(last.when)) : '') + '</div></span>' +
      (last ? '<span class="gbadge g-' + esc(last.letter) + '">' + esc(last.letter) + '</span>' : '<span></span>');

async function loadHistories() {
  await Promise.all((state.profiles || []).map(async p => { histCache[p.name] = await api().History(p) || []; }));
  renderList();
}
function renderHistory(p) {
  const box = $('#hist'), runs = p ? (histCache[p.name] || []) : [];
  box.innerHTML = runs.length ? '' : '<p class="sub" style="margin:0">' + esc(t('gui_history_none')) + '</p>';
  runs.forEach(r => {
    const when = new Date(r.when).toLocaleString(uiLang);
    const line = document.createElement('div'); line.className = 'hline';
    const b = document.createElement('button'); b.type = 'button'; b.className = 'hrow';
    b.innerHTML = '<span class="gbadge g-' + esc(r.letter) + '">' + esc(r.letter) + '</span><span>' + esc(when) +
      '<br><small>' + esc(tf(r.findings === 1 ? 'gui_findings_1' : 'gui_findings_n', r.findings)) + ' · ' + Math.round(r.coverage * 100) + '%</small></span><small>' + (r.letter === '?' ? '' : Math.round(r.value)) + '</small>';
    b.onclick = async () => {
      try { showReport(await api().ReadReport(r.path), r.path, p); } catch (e) { status('err', String(e)); }
    };
    const d = document.createElement('button'); d.type = 'button'; d.className = 'linkbtn'; d.textContent = t('gui_hist_delete');
    d.onclick = async () => {

      try { await api().DeleteRun(p, r.path); } catch (e) { status('err', String(e)); }
      histCache[p.name] = await api().History(p) || []; renderList(); renderHistory(p);
    };
    line.append(b, d); box.appendChild(line);
  });
  if (runs.length > 1) {
    const c = document.createElement('button'); c.type = 'button'; c.className = 'btn'; c.textContent = t('gui_compare');
    c.onclick = () => compare(p, runs[1].path, runs[0].path);
    box.appendChild(c);
  }
}
async function compare(p, older, newer) {
  if (!key.valid) { showKey(); return; }
  try { const r = await api().Compare(older, newer, uiLang); showReport(r.html, r.path, p); }
  catch (e) { status('err', String(e)); }
}

/* ── free key ── */

function keyStatus(kind, msg) { $('#keystatus').innerHTML = kind ? '<div class="alert ' + kind + '"><div><b>' + esc(msg) + '</b></div></div>' : ''; }
function showKey() {
  show('keyview');
  keyStatus(key.valid ? 'ok' : '', key.valid ? tf(key.days_left === 1 ? 'gui_key_valid_1' : 'gui_key_valid', key.days_left) + ' (' + key.expires + ')' : '');
}
function canSend() { $('#rsend').disabled = !($('#rprivacy').checked && $('#rname').value.trim() && $('#remail').value.trim()); }
async function sendKey() {
  $('#rsend').disabled = true; keyStatus('info', t('gui_key_sending'));

    await api().Register({ name: $('#rname').value, email: $('#remail').value, company: $('#rcompany').value, role: $('#rrole').value,
      instances_range: $('#rinst').value, lang: uiLang, privacy_ack: $('#rprivacy').checked, marketing_opt_in: $('#rmkt').checked });

    $('#renewack').hidden = true; await loadKey(); keyStatus('ok', tf('lic_renewed', key.expires));
  } catch (e) { keyStatus('err', String(e)); }

  catch (e) { keyStatus('err', String(e)); }
}
async function loadRules() {
  const rs = await api().Rules(engine, uiLang) || [];
  $('#checksn').textContent = tf('gui_checks_n', rs.length);
  $('#rules').innerHTML = rs.map(r => '<li><span class="dot ' + esc(r.severity) + '"></span><span>' + esc(r.title) + '</span></li>').join('');
}

/* ── feedback ── */
function friendly(err) {
  const m = String(err).toLowerCase();
  if (/azure sql database: set the initial database/.test(m)) return t('gui_err_azure_master');
  if (/login failed|password authentication failed|authentication failed|28p01|18456/.test(m)) return t('gui_err_login');
  if (/certificate|x509|tls/.test(m)) return t('gui_err_cert');
  if (/does not exist|cannot open database|3d000|4060/.test(m)) return t('gui_err_db');
  if (/timeout|deadline exceeded/.test(m)) return t('gui_err_timeout');
  if (/refused|no such host|unreachable|dial tcp|lookup|no connection could be made/.test(m)) return t('gui_err_network');
  return t('gui_err_generic');
}
function status(kind, title, detail) {
  const box = $('#status');
  if (!kind) { box.innerHTML = ''; return; }
  box.innerHTML = '<div class="alert ' + kind + '"><div><b>' + esc(title) + '</b>' +
    (detail ? '<details><summary>' + esc(t('gui_details')) + '</summary><code>' + esc(detail) + '</code></details>' : '') + '</div></div>';
}
function busy(on) { ['#run', '#test', '#save'].forEach(s => $(s).disabled = on); }

/* ── actions ── */
async function save() {
  const p = profileFromForm();
  if (!p.conn.server) { status('err', t('gui_required')); $('#server').focus(); return null; }
  await api().SaveProfile(p, $('#password').value, current || '', uiLang);
  if (current && current !== p.name) { histCache[p.name] = await api().History(p) || []; delete histCache[current]; }
  state = await api().State(); current = p.name; $('#password').value = '';
  $('#pwhint').hidden = false; $('#del').hidden = false; $('#title').textContent = p.name; $('#subtitle').textContent = t('gui_edit_sub');
  renderList();
  return p;
}
async function test() {
  const p = profileFromForm();
  if (!p.conn.server) { status('err', t('gui_required')); $('#server').focus(); return; }
  busy(true); status('info', t('gui_testing'));
  try { status('ok', tf('gui_ready', await api().TestConnection(p, $('#password').value))); }
  catch (e) { status('err', friendly(e), String(e)); }
  finally { busy(false); }
}
async function run(p) {
  if (!p) { try { p = await save(); } catch (e) { status('err', String(e)); return; } if (!p) return; }
  busy(true);
  try {
    show('runner');
    $('#runtitle').textContent = tf('gui_running', p.name); $('#runsub').textContent = p.conn.server;
    $('#steps').innerHTML = ''; $('#progbar').style.width = '0'; $('#stop').disabled = false;
    const r = await api().Run({ ...p, lang: uiLang }, ''); // saved report defaults to the app's language
    showReport(r.html, r.path, p);
    histCache[p.name] = await api().History(p) || []; renderList(); renderHistory(p);
  } catch (e) {
    show('editor');
    if (/context canceled/i.test(String(e))) status('info', t('gui_stopped'));
    else status('err', friendly(e), String(e));
  } finally { busy(false); }
}
function onRule(ev) {
  let li = document.getElementById('step-' + ev.id);
  if (!li) {
    li = document.createElement('li'); li.id = 'step-' + ev.id;
    li.innerHTML = '<span class="ic"></span><span></span><span class="st"></span>';
    li.children[1].textContent = ev.title;
    $('#steps').appendChild(li);
  }
  li.className = ev.status;
  li.children[0].textContent = { ok: '✓', finding: '!', no_data: '–', not_applicable: '–' }[ev.status] || '';
  li.children[2].textContent = ev.status === 'running' ? '' : t(ev.status === 'finding' ? (ev.confidence || 'findings') : ev.status === 'ok' ? 'passed' : ev.status);
  $('#progbar').style.width = Math.round(((ev.i + (ev.status === 'running' ? 0 : 1)) / ev.total) * 100) + '%';
}

/* ── connection strings ── */
function parseCS(s) {
  s = s.trim();
  if (/^postgres(ql)?:\/\//i.test(s)) {
    const u = new URL(s.replace(/^postgres(ql)?:/i, 'http:'));
    return { engine: 'pg', server: u.hostname, port: u.port, database: decodeURIComponent(u.pathname.slice(1)), user: decodeURIComponent(u.username),
      password: decodeURIComponent(u.password), sslmode: u.searchParams.get('sslmode') || '' };
  }
  const kv = {};
  (s.includes(';') ? s.split(';') : s.split(/\s+/)).forEach(part => { const i = part.indexOf('='); if (i > 0) kv[part.slice(0, i).trim().toLowerCase()] = part.slice(i + 1).trim(); });
  if (kv.host || kv.dbname) return { engine: 'pg', server: kv.host, port: kv.port, database: kv.dbname, user: kv.user, password: kv.password, sslmode: kv.sslmode || '' };
  const srv = kv.server || kv['data source'] || kv.address;
  if (!srv) return null;
  const [host, port] = srv.replace(/^tcp:/i, '').split(',');
  const integrated = /^(true|yes|sspi)$/i.test(kv['integrated security'] || kv['trusted_connection'] || '');
  return { engine: 'mssql', server: host, port: port || '', database: kv.database || kv['initial catalog'] || '', user: kv['user id'] || kv.uid || kv.user || '',
    password: kv.password || kv.pwd || '', auth: integrated ? 'windows' : 'sql', trust: /^(true|yes)$/i.test(kv.trustservercertificate || '') };
}

  let c = null; try { c = parseCS($('#cs').value); } catch (e) {}

  setEngine(c.engine); if (c.auth) setAuth(c.auth);
  for (const k of ['server', 'port', 'database', 'user', 'password', 'sslmode']) if (c[k] !== undefined) $('#' + k).value = c[k] || '';
  if (c.trust !== undefined) $('#trust').checked = c.trust;
  if (!$('#name').value) $('#name').value = c.server;
  $('#cs').value = ''; $('#csmsg').textContent = ''; setPaste(false);
};

// addEventListener, not onload: showReport sets onload on every report and would drop this handler
$('#frame').addEventListener('load', () => $('#frame').contentDocument.addEventListener('click', e => {
  const a = e.target.closest('a[href]'); if (!a) return;
  const href = a.getAttribute('href');
  if (href.startsWith('#')) { // srcdoc resolves "#id" against the app URL: scroll instead of navigating away
    e.preventDefault();
    const el = $('#frame').contentDocument.getElementById(decodeURIComponent(href.slice(1)));
    if (el) el.scrollIntoView({ block: 'start' });
  } else if (/^https?:/i.test(href)) { e.preventDefault(); api().OpenURL(a.href); }
}));

  });
});
