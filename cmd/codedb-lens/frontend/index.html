<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>codeDB Lens</title>
<style id="tokens"></style>
<style>
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { font: var(--fs-md)/1.5 var(--font); color: var(--text); background: var(--bg); -webkit-font-smoothing: antialiased;
  display: grid; grid-template-columns: 272px minmax(0, 1fr); overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
[hidden] { display: none !important; }
svg.i { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* ── sidebar ─────────────────────────────── */
aside { background: var(--navy-900); color: var(--on-dark); display: flex; flex-direction: column; min-height: 0; }
.brand { display: flex; gap: var(--s3); align-items: center; padding: var(--s5) var(--s5) var(--s4); }
.brand b { font: 600 var(--fs-xl) var(--font-display); color: #fff; display: block; line-height: 1.1; }
.brand b span { color: var(--sky-400); }
.brand small { color: var(--on-dark-muted); font-size: var(--fs-xs); }
.newbtn { margin: 0 var(--s4) var(--s4); display: flex; align-items: center; justify-content: center; gap: var(--s2); padding: 10px;
  border-radius: var(--r-md); border: 1px dashed rgb(125 211 252 / 40%); background: rgb(56 189 248 / 8%); color: var(--sky-300); cursor: pointer; font-weight: 600; }
.newbtn:hover { background: rgb(56 189 248 / 14%); }
.side-h { padding: 0 var(--s5) var(--s2); font-size: var(--fs-xs); letter-spacing: .08em; text-transform: uppercase; color: var(--on-dark-muted); }
.plist { flex: 1; overflow-y: auto; padding: 0 var(--s3); }
.pitem { width: 100%; display: grid; grid-template-columns: 34px 1fr auto; gap: var(--s3); align-items: center; text-align: left;
  padding: 10px var(--s3); margin-bottom: 2px; border: 0; border-radius: var(--r-md); background: transparent; cursor: pointer; color: var(--on-dark); }
.pitem:hover { background: var(--navy-800); }
.pitem.sel { background: var(--navy-700); box-shadow: inset 3px 0 0 var(--blue-500); }
.pitem .nm { font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pitem .sv { font-size: var(--fs-xs); color: var(--on-dark-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.eng { width: 34px; height: 34px; border-radius: var(--r-sm); display: grid; place-items: center; font: 700 11px var(--font); letter-spacing: .02em; }
.eng.e-mssql { background: rgb(229 72 77 / 16%); color: #ff8a8d; } .eng.e-pg { background: rgb(59 130 246 / 18%); color: #8fb8ff; }
.gbadge { min-width: 26px; height: 22px; padding: 0 6px; border-radius: var(--r-sm); display: grid; place-items: center; font-size: var(--fs-xs); font-weight: 700; color: #fff; }
.g-A { background: var(--ok); } .g-B { background: var(--blue-600); } .g-C { background: var(--med); } .g-D { background: var(--high); } .g-F { background: var(--crit); } .g-\? { background: var(--low); }
.pempty { padding: var(--s3) var(--s5); color: var(--on-dark-muted); font-size: var(--fs-sm); }
.side-foot { padding: var(--s4); display: grid; gap: var(--s3); border-top: 1px solid var(--navy-700); }
.secure { display: flex; gap: var(--s3); padding: var(--s3); border-radius: var(--r-md); background: var(--navy-800); border: 1px solid var(--navy-700); font-size: var(--fs-xs); color: var(--on-dark-muted); }
.secure b { color: #fff; display: block; font-size: var(--fs-sm); margin-bottom: 2px; }
.secure svg { color: var(--ok); }
.side-row { display: flex; justify-content: space-between; align-items: center; font-size: var(--fs-xs); color: var(--on-dark-muted); }
.side-row select { background: var(--navy-800); border: 1px solid var(--navy-700); border-radius: var(--r-sm); padding: 4px 8px; color: var(--on-dark); }
.upd { padding: var(--s3); border-radius: var(--r-md); background: var(--blue-600); color: #fff; font-size: var(--fs-xs); }

/* ── main ─────────────────────────────────── */
main { overflow-y: auto; min-width: 0; }
.wrap { max-width: 1680px; margin: 0 auto; padding: var(--s6) clamp(var(--s4), 3vw, var(--s7)); }
.ph { display: flex; gap: var(--s4); align-items: flex-start; margin-bottom: var(--s5); }
.ph-ic { width: 48px; height: 48px; border-radius: var(--r-md); background: var(--navy-900); color: var(--sky-400); display: grid; place-items: center; flex: none; }
.ph-ic svg { width: 26px; height: 26px; }
.ph h1 { margin: 0; font: 700 var(--fs-2xl)/1.2 var(--font-display); letter-spacing: -.01em; }
.ph p { margin: var(--s1) 0 0; color: var(--muted); }
.ph .hact { margin-left: auto; display: flex; gap: var(--s2); }
.grid { display: grid; grid-template-columns: minmax(0, 1fr) clamp(300px, 26vw, 380px); gap: var(--s5); align-items: start; }
@media (max-width: 1180px) { .grid { grid-template-columns: minmax(0, 1fr); } }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow-sm); }
.card + .card { margin-top: var(--s4); }
.sec { padding: var(--s5); }
.sec + .sec { border-top: 1px solid var(--line); }
.sh { display: flex; gap: var(--s3); align-items: flex-start; margin-bottom: var(--s4); }
.num { width: 28px; height: 28px; border-radius: 50%; background: var(--navy-900); color: #fff; display: grid; place-items: center; font-size: var(--fs-sm); font-weight: 700; flex: none; }
.sh h2 { margin: 0; font-size: var(--fs-lg); }
.sh p { margin: 2px 0 0; color: var(--muted); font-size: var(--fs-sm); }
.sh .right { margin-left: auto; }

.engines { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: var(--s3); }
.etile { display: flex; gap: var(--s3); align-items: center; padding: var(--s4); border: 1.5px solid var(--line); border-radius: var(--r-md);
  background: var(--surface); cursor: pointer; text-align: left; transition: border-color .15s var(--ease), box-shadow .15s var(--ease); }
.etile:hover { border-color: var(--line-strong); }
.etile[aria-pressed="true"] { border-color: var(--blue-600); box-shadow: var(--focus); background: var(--blue-50); }
.etile .eng { width: 44px; height: 44px; font-size: 13px; }
.etile .eng.e-mssql { background: var(--crit-bg); color: var(--crit); } .etile .eng.e-pg { background: var(--blue-100); color: var(--blue-700); }
.etile b { display: block; font-size: var(--fs-lg); }
.etile small { color: var(--muted); font-size: var(--fs-xs); }

.fields { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: var(--s4) var(--s4); }
.f { display: flex; flex-direction: column; gap: 6px; grid-column: span 6; min-width: 0; }
.f.w8 { grid-column: span 8; } .f.w4 { grid-column: span 4; } .f.w12 { grid-column: span 12; }
@media (max-width: 760px) { .f, .f.w8, .f.w4 { grid-column: span 12; } }
.f > label { font-size: var(--fs-sm); font-weight: 600; color: var(--text-2); }
.f > label .req { color: var(--crit); }
.f .hint { font-size: var(--fs-xs); color: var(--muted); }
.ctl { display: flex; align-items: center; gap: var(--s2); border: 1px solid var(--line-strong); border-radius: var(--r-sm); background: var(--surface); padding: 0 var(--s3); height: 40px;
  transition: border-color .15s, box-shadow .15s; }
.ctl:focus-within { border-color: var(--blue-600); box-shadow: var(--focus); }
.ctl svg { color: var(--muted); }
.ctl input, .ctl select { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; height: 100%; }
.ctl .eye { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: var(--fs-xs); padding: 4px; }
textarea.cs { width: 100%; min-height: 76px; border: 1px solid var(--line-strong); border-radius: var(--r-sm); padding: var(--s3); font: var(--fs-sm) var(--mono); resize: vertical; }
.seg { display: inline-flex; padding: 3px; border-radius: var(--r-md); background: var(--surface-2); border: 1px solid var(--line); gap: 2px; align-self: flex-start; }
.seg button { border: 0; background: transparent; padding: 7px 14px; border-radius: var(--r-sm); cursor: pointer; color: var(--muted); font-weight: 600; font-size: var(--fs-sm); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); }
.check { display: flex; gap: var(--s2); align-items: center; font-size: var(--fs-sm); color: var(--text-2); grid-column: span 12; cursor: pointer; }
.check input { width: 16px; height: 16px; accent-color: var(--blue-600); }
.linkbtn { border: 0; background: none; color: var(--blue-600); cursor: pointer; padding: 0; font-weight: 600; font-size: var(--fs-sm); display: inline-flex; gap: 6px; align-items: center; }
details.adv { margin-top: var(--s4); border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface-2); }
details.adv summary { cursor: pointer; padding: var(--s3) var(--s4); font-weight: 600; font-size: var(--fs-sm); color: var(--text-2); list-style: none; display: flex; gap: var(--s2); align-items: center; }
details.adv summary::-webkit-details-marker { display: none; }
details.adv summary::before { content: "›"; display: inline-block; transition: transform .15s; font-size: 18px; line-height: 1; }
details.adv[open] summary::before { transform: rotate(90deg); }
details.adv .fields { padding: 0 var(--s4) var(--s4); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--s2); height: 40px; padding: 0 var(--s4); border-radius: var(--r-sm);
  border: 1px solid var(--line-strong); background: var(--surface); cursor: pointer; font-weight: 600; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--blue-600); border-color: var(--blue-600); color: #fff; padding: 0 var(--s5); }
.btn.primary:hover { background: var(--blue-700); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.danger { color: var(--crit); border-color: var(--crit); }
.btn.danger:hover { background: var(--crit-bg); }
.btn:disabled { opacity: .55; cursor: default; }
.actions { display: flex; gap: var(--s3); flex-wrap: wrap; align-items: center; }
.actions .sp { flex: 1; }

.alert { display: flex; gap: var(--s3); padding: var(--s3) var(--s4); border-radius: var(--r-md); margin-bottom: var(--s4); font-size: var(--fs-sm); }
.alert b { display: block; }
.alert.ok { background: var(--ok-bg); color: #116b33; } .alert.err { background: var(--crit-bg); color: #9b1c1f; } .alert.info { background: var(--info-bg); color: var(--blue-700); }
.alert details { margin-top: 4px; } .alert summary { cursor: pointer; opacity: .8; } .alert code { font: var(--fs-xs) var(--mono); word-break: break-word; }

/* rail */
.rail .card { padding: var(--s4) var(--s5); }
.rail h3 { margin: 0 0 var(--s3); font-size: var(--fs-md); display: flex; gap: var(--s2); align-items: center; }
.rail h3 svg { color: var(--blue-600); }
.rail .sub { color: var(--muted); font-size: var(--fs-xs); margin: -6px 0 var(--s3); }
.rules { max-height: 260px; overflow-y: auto; list-style: none; margin: 0; padding: 0; display: grid; gap: var(--s2); font-size: var(--fs-sm); }
.rules li { display: flex; gap: var(--s2); align-items: baseline; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; transform: translateY(-1px); background: var(--low); }
.dot.critical { background: var(--crit); } .dot.high { background: var(--high); } .dot.medium { background: var(--med); }
.hist { display: grid; gap: 6px; }
.hrow { display: grid; grid-template-columns: auto 1fr auto; gap: var(--s3); align-items: center; padding: 8px 10px; border-radius: var(--r-sm); border: 1px solid var(--line);
  background: var(--surface); cursor: pointer; text-align: left; font-size: var(--fs-sm); }
.hrow:hover { border-color: var(--line-strong); }
.hrow small { color: var(--muted); }
.code { background: var(--navy-900); color: var(--on-dark); border-radius: var(--r-md); padding: var(--s3) var(--s4); font: 12px/1.6 var(--mono); white-space: pre-wrap; word-break: break-word; }
.promo { background: var(--hero); color: #fff; border-radius: var(--r-md); display: flex; gap: var(--s3); align-items: center; padding: var(--s3); }
.promo > div { flex: 1; min-width: 0; font-size: var(--fs-xs); color: var(--on-dark); }
.promo b { display: block; color: #fff; font-size: var(--fs-sm); }
.promo .btn { background: #fff; color: var(--navy-900); border: 0; height: 30px; padding: 0 var(--s3); font-size: var(--fs-xs); }
.promo.mini { flex-direction: column; align-items: stretch; gap: var(--s2); } .promo.mini .btn { width: 100%; }
.promo.wide { margin: 0; border-radius: 0; padding: var(--s3) var(--s5); }

/* run view */
.run { max-width: 760px; }
.prog { height: 6px; border-radius: var(--r-pill); background: var(--line); overflow: hidden; margin: var(--s4) 0 var(--s5); }
.prog i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--blue-600), var(--sky-400)); transition: width .3s var(--ease); }
.steps { list-style: none; padding: 0; margin: 0; display: grid; gap: var(--s2); }
.steps li { display: grid; grid-template-columns: 24px 1fr auto; gap: var(--s3); align-items: center; padding: var(--s3) var(--s4); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); }
.steps .st { font-size: var(--fs-xs); font-weight: 600; color: var(--muted); }
.steps .ic { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; color: #fff; background: var(--line-strong); }
.steps li.running .ic { background: none; border: 2px solid var(--blue-500); border-top-color: transparent; animation: spin 0.8s linear infinite; }
.steps li.ok .ic { background: var(--ok); } .steps li.finding .ic { background: var(--high); } .steps li.no_data .ic { background: var(--low); }
@keyframes spin { to { transform: rotate(360deg); } }
.view { position: fixed; inset: 0 0 0 272px; display: flex; flex-direction: column; background: var(--bg); }
.vbar { display: flex; gap: var(--s2); align-items: center; padding: var(--s3) var(--s5); background: var(--surface); border-bottom: 1px solid var(--line); }
.vbar .sp { flex: 1; }
.view iframe { flex: 1; width: 100%; border: 0; }
/* free key */
.keychip { display: flex; gap: var(--s2); align-items: center; width: 100%; padding: 8px 10px; border-radius: var(--r-sm); border: 1px solid rgb(255 255 255 / 18%);
  background: rgb(255 255 255 / 6%); color: #fff; cursor: pointer; font-size: var(--fs-xs); text-align: left; }
.keychip:hover { background: rgb(255 255 255 / 12%); }
.keychip svg { color: var(--sky-300); }
.consent { display: grid; gap: var(--s3); margin: var(--s4) 0; }
.consent .check { align-items: flex-start; }
.consent a { color: var(--blue-600); }
.notice { font-size: var(--fs-xs); color: var(--muted); margin: 0 0 var(--s4); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <symbol id="i-db" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></symbol>
  <symbol id="i-server" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></symbol>
  <symbol id="i-tag" viewBox="0 0 24 24"><path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="7.5" r="1.5"/></symbol>
  <symbol id="i-plug" viewBox="0 0 24 24"><path d="M9 2v6M15 2v6M6 8h12v4a6 6 0 0 1-12 0zM12 18v4"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h12M9 12h12M9 18h12M4 6h.01M4 12h.01M4 18h.01"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
  <symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
  <symbol id="i-paste" viewBox="0 0 24 24"><rect x="8" y="3" width="8" height="4" rx="1"/><path d="M8 5H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/></symbol>
</svg>

<aside>
  <div class="brand"><img src="icon.png" width="40" height="40" alt=""><div><b>codeDB <span>Lens</span></b><small id="ver"></small></div></div>
  <button class="newbtn" id="new"><svg class="i"><use href="#i-plus"/></svg><span data-t="gui_new_title"></span></button>
  <div class="side-h" data-t="gui_connections"></div>
  <div class="plist" id="plist"></div>
  <div class="side-foot">
    <div class="upd" id="upd" hidden></div>
    <div class="secure"><svg class="i"><use href="#i-shield"/></svg><div><b data-t="gui_secure_title"></b><span data-t="gui_secure"></span></div></div>
    <button type="button" class="keychip" id="keychip"><svg class="i"><use href="#i-key"/></svg><span id="keylbl"></span></button>
    <div class="promo mini"><div><b data-t="gui_promo_title"></b></div><button type="button" class="btn promo-cta" data-t="gui_promo_cta"></button></div>
    <div class="side-row">
      <a href="#" id="powered" style="color:var(--sky-300);text-decoration:none">Powered by codeDB</a>
      <select id="uilang" aria-label="Language"><option value="en">English</option><option value="pt-BR">Português</option></select>
    </div>
  </div>
</aside>

<main id="main">
<div class="wrap" id="editor">
  <div class="ph">
    <div class="ph-ic"><svg class="i"><use href="#i-db"/></svg></div>
    <div><h1 id="title"></h1><p id="subtitle"></p></div>
    <div class="hact">
      <button class="btn" id="dup" hidden data-t="gui_duplicate"></button>
      <button class="btn danger" id="del" hidden data-t="gui_delete"></button>
    </div>
  </div>

  <div class="grid">
    <form id="f" autocomplete="off" onsubmit="return false">
      <div class="card">
        <div class="sec">
          <div class="engines" role="group">
            <button type="button" class="etile" data-engine="mssql"><span class="eng e-mssql">SQL</span><span><b>SQL Server</b><small data-t="gui_mssql_sub"></small></span></button>
            <button type="button" class="etile" data-engine="pg"><span class="eng e-pg">PG</span><span><b>PostgreSQL</b><small data-t="gui_pg_sub"></small></span></button>
          </div>
        </div>

        <div class="sec">
          <div class="sh"><span class="num">1</span><div><h2 data-t="gui_step_server"></h2><p data-t="gui_step_server_sub"></p></div>
            <button type="button" class="linkbtn right" id="pastebtn" aria-expanded="false" aria-controls="pastebox"><svg class="i"><use href="#i-paste"/></svg><span id="pastelbl" data-t="gui_paste"></span></button></div>
          <div id="pastebox" hidden style="margin-bottom:var(--s4)">
            <textarea class="cs" id="cs" spellcheck="false" placeholder="Server=sql01,1433;Database=app;User Id=lens;Password=…   |   postgres://lens@pg01:5432/app"></textarea>
            <div class="actions" style="margin-top:var(--s2)"><button type="button" class="btn" id="csapply" data-t="gui_paste_apply"></button><span id="csmsg" class="hint"></span></div>
          </div>
          <div class="fields">
            <div class="f w8"><label for="server"><span data-t="gui_server"></span> <span class="req">*</span></label>
              <div class="ctl"><svg class="i"><use href="#i-server"/></svg><input id="server" name="server" placeholder="sql01.corp.local · sql01\INSTANCE"></div></div>
            <div class="f w4"><label for="port" data-t="gui_port"></label>
              <div class="ctl"><input id="port" name="port" type="number" min="1" max="65535" placeholder="1433"></div></div>
            <div class="f"><label for="name" data-t="gui_name"></label>
              <div class="ctl"><svg class="i"><use href="#i-tag"/></svg><input id="name" name="name" placeholder="Produção · SQL01"></div>
              <span class="hint" data-t="gui_name_hint"></span></div>
            <div class="f"><label for="database" data-t="gui_database"></label>
              <div class="ctl"><svg class="i"><use href="#i-db"/></svg><input id="database" name="database" placeholder="master"></div></div>
          </div>
        </div>

        <div class="sec">
          <div class="sh"><span class="num">2</span><div><h2 data-t="gui_step_auth"></h2><p data-t="gui_step_auth_sub"></p></div></div>
          <div class="fields">
            <div class="f w12 mssql"><div class="seg" id="authseg">

<script>
const $ = s => document.querySelector(s), $$ = s => document.querySelectorAll(s), api = () => window.go.main.App;
const PERMS = {
  mssql: "CREATE LOGIN codedb_lens WITH PASSWORD = '<senha>';\nGRANT VIEW SERVER STATE TO codedb_lens;\nGRANT VIEW ANY DEFINITION TO codedb_lens;\nGRANT CONNECT ANY DATABASE TO codedb_lens;\nUSE msdb;\nCREATE USER codedb_lens FOR LOGIN codedb_lens;\nALTER ROLE db_datareader ADD MEMBER codedb_lens;\nALTER ROLE SQLAgentReaderRole ADD MEMBER codedb_lens;",
  pg: "CREATE ROLE codedb_lens LOGIN PASSWORD '<senha>';\nGRANT pg_monitor TO codedb_lens;\nGRANT CONNECT ON DATABASE app TO codedb_lens;"
};
let key = {}, state, texts = {}, uiLang = 'en', current = null, engine = 'mssql', auth = 'windows', lastPath = '', lastProfile = null, histCache = {};

const t = k => texts[k] || k;
const tf = (k, ...a) => a.reduce((s, v) => s.replace(/%[sd]/, v), t(k));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function applyTexts() { $$('[data-t]').forEach(e => e.textContent = t(e.dataset.t)); }
function ago(iso) {
  const s = (new Date(iso) - Date.now()) / 1000, rtf = new Intl.RelativeTimeFormat(uiLang, { numeric: 'auto' });
  for (const [u, n] of [['day', 86400], ['hour', 3600], ['minute', 60]]) if (Math.abs(s) >= n) return rtf.format(Math.round(s / n), u);
  return rtf.format(Math.round(s), 'second');
}

/* ── form state ── */
function setEngine(e) {
  engine = e;
  $$('.etile').forEach(b => b.setAttribute('aria-pressed', b.dataset.engine === e));
  $('#port').placeholder = e === 'pg' ? '5432' : '1433';
  $('#database').placeholder = e === 'pg' ? 'postgres' : 'master';
  $('#permtext').textContent = PERMS[e];
  toggle(); loadRules();
}
function setAuth(a) { auth = a; $$('#authseg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.auth === a)); toggle(); }
function toggle() {
  const ms = engine === 'mssql';
  $$('.mssql').forEach(e => e.hidden = !ms);
  $$('.pg').forEach(e => e.hidden = ms);
  $$('.cred').forEach(e => e.hidden = ms && auth === 'windows');
}
function profileFromForm() {
  const v = id => $('#' + id).value.trim();
  return { name: v('name') || v('server'), lang: $('#lang').value, out_dir: v('out_dir'), conn: {
    engine, server: v('server'), port: +v('port') || 0, database: v('database'), auth: engine === 'mssql' ? auth : '',
    user: v('user'), trust_server_cert: $('#trust').checked, sslmode: $('#sslmode').value } };
}
function fill(p) {
  current = p ? p.name : null;
  const c = (p && p.conn) || { engine: 'mssql', auth: 'windows', server: '' };
  for (const [id, val] of [['name', p ? p.name : ''], ['server', c.server || ''], ['port', c.port || ''], ['database', c.database || ''],
    ['user', c.user || ''], ['password', ''], ['out_dir', (p && p.out_dir) || ''], ['sslmode', c.sslmode || ''], ['lang', (p && p.lang) || uiLang]]) $('#' + id).value = val;
  $('#trust').checked = !!c.trust_server_cert;
  setAuth(c.auth || (c.engine === 'mssql' ? 'windows' : 'sql'));
  setEngine(c.engine || 'mssql');
  $('#pwhint').hidden = !p; $('#del').hidden = !p; $('#dup').hidden = !p;
  $('#title').textContent = p ? p.name : t('gui_new_title');
  $('#subtitle').textContent = p ? t('gui_edit_sub') : t('gui_new_sub');
  setPaste(false); status(); renderList(); renderHistory(p);
}
function setPaste(open) {
  $('#pastebox').hidden = !open; $('#pastebtn').setAttribute('aria-expanded', open);
  const l = $('#pastelbl'); l.dataset.t = open ? 'gui_paste_hide' : 'gui_paste'; l.textContent = t(l.dataset.t);
  if (open) $('#cs').focus();
}
function showReport(html, path, p) {
  lastPath = path; lastProfile = p; $('#view').hidden = false;
  const f = $('#frame'); // reports carry both languages: open them in the app's, whatever the run used
  f.onload = () => { try { const h = f.contentDocument.documentElement; h.dataset.lang = h.lang = uiLang; } catch (e) {} };
  f.srcdoc = html;
}

/* ── sidebar & rail ── */
function renderList() {
  const box = $('#plist'); box.innerHTML = '';
  const ps = state.profiles || [];
  if (!ps.length) { box.innerHTML = '<div class="pempty">' + esc(t('gui_no_conn')) + '</div>'; return; }
  ps.forEach(p => {
    const last = (histCache[p.name] || [])[0];
    const b = document.createElement('button');
    b.className = 'pitem' + (p.name === current ? ' sel' : '');
    b.innerHTML = '<span class="eng e-' + esc(p.conn.engine) + '">' + (p.conn.engine === 'pg' ? 'PG' : 'SQL') + '</span>' +
      '<span style="min-width:0"><div class="nm">' + esc(p.name) + '</div><div class="sv">' + esc(p.conn.server) + (last ? ' · ' + esc(ago(last.when)) : '') + '</div></span>' +
      (last ? '<span class="gbadge g-' + esc(last.letter) + '">' + esc(last.letter) + '</span>' : '<span></span>');
    b.onclick = () => fill(p);
    box.appendChild(b);
  });
}
async function loadHistories() {
  await Promise.all((state.profiles || []).map(async p => { histCache[p.name] = await api().History(p) || []; }));
  renderList();
}
function renderHistory(p) {
  const box = $('#hist'), runs = p ? (histCache[p.name] || []) : [];
  box.innerHTML = runs.length ? '' : '<p class="sub" style="margin:0">' + esc(t('gui_history_none')) + '</p>';
  runs.forEach(r => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'hrow';
    b.innerHTML = '<span class="gbadge g-' + esc(r.letter) + '">' + esc(r.letter) + '</span><span>' + esc(new Date(r.when).toLocaleString(uiLang)) +
      '<br><small>' + esc(tf(r.findings === 1 ? 'gui_findings_1' : 'gui_findings_n', r.findings)) + ' · ' + Math.round(r.coverage * 100) + '%</small></span><small>' + (r.letter === '?' ? '' : Math.round(r.value)) + '</small>';
    b.onclick = async () => {
      try { showReport(await api().ReadReport(r.path), r.path, p); } catch (e) { status('err', String(e)); }
    };
    box.appendChild(b);
  });
  if (runs.length > 1) {
    const c = document.createElement('button'); c.type = 'button'; c.className = 'btn'; c.textContent = t('gui_compare');
    c.onclick = () => compare(p, runs[1].path, runs[0].path);
    box.appendChild(c);
  }
}
async function compare(p, older, newer) {
  if (!key.valid) { showKey(); return; }
  try { const r = await api().Compare(older, newer, uiLang); showReport(r.html, r.path, p); }
  catch (e) { status('err', String(e)); }
}

/* ── free key ── */
async function loadKey() {
  key = await api().LicenseStatus(uiLang);
  $('#keylbl').textContent = key.valid ? tf(key.days_left === 1 ? 'gui_key_valid_1' : 'gui_key_valid', key.days_left) : key.expired ? t('gui_key_expired') : t('gui_key_activate');
  $('#lprivacy').textContent = key.consent.privacy_ack; $('#lmkt').textContent = key.consent.marketing; $('#rnotice').textContent = key.consent.notice;
  const opts = (list, label) => '<option value=""></option>' + list.map(v => '<option value="' + esc(v) + '">' + esc(label(v)) + '</option>').join('');
  const r = $('#rrole').value, i = $('#rinst').value;
  $('#rrole').innerHTML = opts(key.roles, v => t('role_' + v)); $('#rrole').value = r;
  $('#rinst').innerHTML = opts(key.ranges, v => v === '100+' ? t('range_100+') : v.replace('-', '–')); $('#rinst').value = i;
  $('#rremove').hidden = !key.valid && !key.expired;
  $('#renewcard').hidden = !key.can_renew; $('#lrenewack').textContent = key.consent.privacy_ack;
}
function keyStatus(kind, msg) { $('#keystatus').innerHTML = kind ? '<div class="alert ' + kind + '"><div><b>' + esc(msg) + '</b></div></div>' : ''; }
function showKey() {
  $('#editor').hidden = true; $('#runner').hidden = true; $('#view').hidden = true; $('#keyview').hidden = false;
  keyStatus(key.valid ? 'ok' : '', key.valid ? tf(key.days_left === 1 ? 'gui_key_valid_1' : 'gui_key_valid', key.days_left) + ' (' + key.expires + ')' : '');
}
function canSend() { $('#rsend').disabled = !($('#rprivacy').checked && $('#rname').value.trim() && $('#remail').value.trim()); }
async function sendKey() {
  $('#rsend').disabled = true; keyStatus('info', t('gui_key_sending'));
  try {
    await api().Register({ name: $('#rname').value, email: $('#remail').value, company: $('#rcompany').value, role: $('#rrole').value,
      instances_range: $('#rinst').value, lang: uiLang, privacy_ack: $('#rprivacy').checked, marketing_opt_in: $('#rmkt').checked });
    await loadKey(); keyStatus('ok', tf('lic_saved', key.expires) + ' ' + key.consent.sent);
  } catch (e) { keyStatus('err', String(e)); }
  finally { canSend(); }
}
async function renewKey() {
  const ack = !$('#renewack').hidden;
  if (ack && !$('#rrenewack').checked) { keyStatus('err', t('lic_renew_consent')); return; }
  $('#rrenew').disabled = true; keyStatus('info', t('gui_key_sending'));
  try {
    const r = await api().RenewLicense(uiLang, ack);
    if (r.consent_required) { $('#renewack').hidden = false; keyStatus('err', t('lic_renew_consent')); return; }
    $('#renewack').hidden = true; await loadKey(); keyStatus('ok', tf('lic_renewed', key.expires));
  } catch (e) { keyStatus('err', String(e)); }
  finally { $('#rrenew').disabled = false; }
}
async function importKey() {
  try { await api().ImportLicense($('#rtoken').value, uiLang); $('#rtoken').value = ''; await loadKey(); keyStatus('ok', tf('lic_saved', key.expires)); }
  catch (e) { keyStatus('err', String(e)); }
}
async function loadRules() {
  const rs = await api().Rules(engine, uiLang) || [];
  $('#checksn').textContent = tf('gui_checks_n', rs.length);
  $('#rules').innerHTML = rs.map(r => '<li><span class="dot ' + esc(r.severity) + '"></span><span>' + esc(r.title) + '</span></li>').join('');
}

/* ── feedback ── */
function friendly(err) {
  const m = String(err).toLowerCase();
  if (/azure sql database: set the initial database/.test(m)) return t('gui_err_azure_master');
  if (/login failed|password authentication failed|authentication failed|28p01|18456/.test(m)) return t('gui_err_login');
  if (/certificate|x509|tls/.test(m)) return t('gui_err_cert');
  if (/does not exist|cannot open database|3d000|4060/.test(m)) return t('gui_err_db');
  if (/timeout|deadline exceeded/.test(m)) return t('gui_err_timeout');
  if (/refused|no such host|unreachable|dial tcp|lookup|no connection could be made/.test(m)) return t('gui_err_network');
  return t('gui_err_generic');
}
function status(kind, title, detail) {
  const box = $('#status');
  if (!kind) { box.innerHTML = ''; return; }
  box.innerHTML = '<div class="alert ' + kind + '"><div><b>' + esc(title) + '</b>' +
    (detail ? '<details><summary>' + esc(t('gui_details')) + '</summary><code>' + esc(detail) + '</code></details>' : '') + '</div></div>';
}
function busy(on) { ['#run', '#test', '#save'].forEach(s => $(s).disabled = on); }

/* ── actions ── */
async function save() {
  const p = profileFromForm();
  if (!p.conn.server) { status('err', t('gui_required')); $('#server').focus(); return null; }
  await api().SaveProfile(p, $('#password').value, current || '', uiLang);
  if (current && current !== p.name) { histCache[p.name] = await api().History(p) || []; delete histCache[current]; }
  state = await api().State(); current = p.name; $('#password').value = '';
  $('#pwhint').hidden = false; $('#del').hidden = false; $('#title').textContent = p.name; $('#subtitle').textContent = t('gui_edit_sub');
  renderList();
  return p;
}
async function test() {
  const p = profileFromForm();
  if (!p.conn.server) { status('err', t('gui_required')); $('#server').focus(); return; }
  busy(true); status('info', t('gui_testing'));
  try { status('ok', tf('gui_ready', await api().TestConnection(p, $('#password').value))); }
  catch (e) { status('err', friendly(e), String(e)); }
  finally { busy(false); }
}
async function run(p) {
  if (!p) { try { p = await save(); } catch (e) { status('err', String(e)); return; } if (!p) return; }
  busy(true);
  try {
    $('#editor').hidden = true; $('#runner').hidden = false;
    $('#runtitle').textContent = tf('gui_running', p.name); $('#runsub').textContent = p.conn.server;
    $('#steps').innerHTML = ''; $('#progbar').style.width = '0'; $('#stop').disabled = false;
    const r = await api().Run({ ...p, lang: uiLang }, ''); // saved report defaults to the app's language
    showReport(r.html, r.path, p);
    histCache[p.name] = await api().History(p) || []; renderList(); renderHistory(p);
  } catch (e) {
    $('#runner').hidden = true; $('#editor').hidden = false;
    if (/context canceled/i.test(String(e))) status('info', t('gui_stopped'));
    else status('err', friendly(e), String(e));
  } finally { busy(false); }
}
function onRule(ev) {
  let li = document.getElementById('step-' + ev.id);
  if (!li) {
    li = document.createElement('li'); li.id = 'step-' + ev.id;
    li.innerHTML = '<span class="ic"></span><span></span><span class="st"></span>';
    li.children[1].textContent = ev.title;
    $('#steps').appendChild(li);
  }
  li.className = ev.status;
  li.children[0].textContent = { ok: '✓', finding: '!', no_data: '–', not_applicable: '–' }[ev.status] || '';
  li.children[2].textContent = ev.status === 'running' ? '' : t(ev.status === 'finding' ? (ev.confidence || 'findings') : ev.status === 'ok' ? 'passed' : ev.status);
  $('#progbar').style.width = Math.round(((ev.i + (ev.status === 'running' ? 0 : 1)) / ev.total) * 100) + '%';
}

/* ── connection strings ── */
function parseCS(s) {
  s = s.trim();
  if (/^postgres(ql)?:\/\//i.test(s)) {
    const u = new URL(s.replace(/^postgres(ql)?:/i, 'http:'));
    return { engine: 'pg', server: u.hostname, port: u.port, database: decodeURIComponent(u.pathname.slice(1)), user: decodeURIComponent(u.username),
      password: decodeURIComponent(u.password), sslmode: u.searchParams.get('sslmode') || '' };
  }
  const kv = {};
  (s.includes(';') ? s.split(';') : s.split(/\s+/)).forEach(part => { const i = part.indexOf('='); if (i > 0) kv[part.slice(0, i).trim().toLowerCase()] = part.slice(i + 1).trim(); });
  if (kv.host || kv.dbname) return { engine: 'pg', server: kv.host, port: kv.port, database: kv.dbname, user: kv.user, password: kv.password, sslmode: kv.sslmode || '' };
  const srv = kv.server || kv['data source'] || kv.address;
  if (!srv) return null;
  const [host, port] = srv.replace(/^tcp:/i, '').split(',');
  const integrated = /^(true|yes|sspi)$/i.test(kv['integrated security'] || kv['trusted_connection'] || '');
  return { engine: 'mssql', server: host, port: port || '', database: kv.database || kv['initial catalog'] || '', user: kv['user id'] || kv.uid || kv.user || '',
    password: kv.password || kv.pwd || '', auth: integrated ? 'windows' : 'sql', trust: /^(true|yes)$/i.test(kv.trustservercertificate || '') };
}

/* ── wiring ── */
$$('.etile').forEach(b => b.onclick = () => setEngine(b.dataset.engine));
$$('#authseg button').forEach(b => b.onclick = () => setAuth(b.dataset.auth));
$('#new').onclick = () => fill(null);
$('#eye').onclick = () => { const p = $('#password'); p.type = p.type === 'password' ? 'text' : 'password'; };
$('#pastebtn').onclick = () => setPaste($('#pastebox').hidden);
$('#csapply').onclick = () => {
  let c = null; try { c = parseCS($('#cs').value); } catch (e) {}
  if (!c || !c.server) { $('#csmsg').textContent = t('gui_paste_bad'); return; }
  setEngine(c.engine); if (c.auth) setAuth(c.auth);
  for (const k of ['server', 'port', 'database', 'user', 'password', 'sslmode']) if (c[k] !== undefined) $('#' + k).value = c[k] || '';
  if (c.trust !== undefined) $('#trust').checked = c.trust;
  if (!$('#name').value) $('#name').value = c.server;
  $('#cs').value = ''; $('#csmsg').textContent = ''; setPaste(false);
};
$('#save').onclick = async () => { try { if (await save()) status('ok', t('gui_saved')); } catch (e) { status('err', String(e)); } };
$('#del').onclick = async () => {
  if (!current || !await api().Confirm(t('gui_delete'), tf('gui_delete_confirm', current))) return;
  await api().DeleteProfile(current); state = await api().State(); fill(null);
};
$('#dup').onclick = async () => {
  try {
    const p = await api().DuplicateProfile(current);
    state = await api().State(); histCache[p.name] = [];
    fill(p); $('#name').focus(); $('#name').select();
  } catch (e) { status('err', String(e)); }
};
$('#keychip').onclick = showKey;
$('#keyback').onclick = () => { $('#keyview').hidden = true; $('#editor').hidden = false; };
['#rname', '#remail', '#rprivacy'].forEach(s => $(s).addEventListener('input', canSend));
$('#privlink').onclick = e => { e.preventDefault(); api().OpenURL(key.privacy); };
$('#privlink2').onclick = $('#privlink').onclick;
$('#rsend').onclick = sendKey;
$('#rimport').onclick = importKey;
$('#rrenew').onclick = renewKey;
$('#rremove').onclick = async () => { if (await api().Confirm(t('gui_key_remove'), t('gui_key_remove') + '?')) { await api().RemoveLicense(); await loadKey(); keyStatus(); } };
$('#stop').onclick = () => { $('#stop').disabled = true; api().Cancel(); };
$('#test').onclick = test;
$('#run').onclick = () => run();
$('#f').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.tagName !== 'TEXTAREA') { e.preventDefault(); e.ctrlKey ? run() : test(); } });
$('#copy').onclick = async () => { try { await navigator.clipboard.writeText(PERMS[engine]); $('#copy').textContent = t('gui_copied'); setTimeout(applyTexts, 1500); } catch (e) {} };
document.querySelectorAll('.promo-cta').forEach(b => b.onclick = () => api().OpenURL(state.landing));
$('#powered').onclick = e => { e.preventDefault(); api().OpenURL(state.landing); };
$('#back').onclick = () => { $('#view').hidden = true; $('#keyview').hidden = true; $('#runner').hidden = true; $('#editor').hidden = false; status(); };
$('#again').onclick = () => { $('#view').hidden = true; run(lastProfile); };
$('#browser').onclick = () => api().OpenReport(lastPath);
$('#folder').onclick = () => api().OpenFolder(lastPath);
// addEventListener, not onload: showReport sets onload on every report and would drop this handler
$('#frame').addEventListener('load', () => $('#frame').contentDocument.addEventListener('click', e => {
  const a = e.target.closest('a[href]'); if (!a) return;
  const href = a.getAttribute('href');
  if (href.startsWith('#')) { // srcdoc resolves "#id" against the app URL: scroll instead of navigating away
    e.preventDefault();
    const el = $('#frame').contentDocument.getElementById(decodeURIComponent(href.slice(1)));
    if (el) el.scrollIntoView({ block: 'start' });
  } else if (/^https?:/i.test(href)) { e.preventDefault(); api().OpenURL(a.href); }
}));
$('#uilang').onchange = async e => {
  uiLang = e.target.value; texts = await api().Texts(uiLang); applyTexts();
  const p = (state.profiles || []).find(x => x.name === current);
  $('#title').textContent = p ? p.name : t('gui_new_title'); $('#subtitle').textContent = p ? t('gui_edit_sub') : t('gui_new_sub');
  loadRules(); renderList(); renderHistory(p); loadKey();
};

window.addEventListener('DOMContentLoaded', async () => {
  state = await api().State();
  uiLang = state.lang; texts = state.texts;
  $('#tokens').textContent = state.tokens; $('#ver').textContent = 'v' + state.version + ' · by codeDB';
  $('#uilang').value = uiLang; applyTexts();
  window.runtime.EventsOn('rule', onRule);
  const last = (state.profiles || []).find(p => p.name === state.last);
  fill(last || null);
  loadKey();
  loadHistories().then(() => renderHistory(last || null));
  api().UpdateNotice(uiLang).then(m => { if (m) { $('#upd').textContent = m; $('#upd').hidden = false; } });
  if (last) { // validate the last connection on open
    status('info', t('gui_testing'));
    try { status('ok', tf('gui_ready', await api().TestConnection(last, ''))); } catch (e) { status('err', friendly(e), String(e)); }
  } else { $('#server').focus(); }
});
</script>
</body>
</html>
