version: 2
project_name: codedb-lens

before:
  hooks:
    - go mod tidy
    - go generate ./cmd/codedb-lens   # Windows icon + manifest (.syso)

builds:
  - id: windows
    main: ./cmd/codedb-lens
    binary: codedb-lens
    goos: [windows]
    goarch: [amd64]
    tags: [desktop, production]
    env: [CGO_ENABLED=0]
    ldflags: ["-s -w -H windowsgui -X main.version={{ .Version }}"]
    hooks:
      post:
        # Console twin of the GUI .exe, so terminals wait for it (see cmd/codedb-lens-com). Shipped in the zip and the installer.
        - cmd: go build -ldflags "-s -w" -o build/windows/codedb-lens.com ./cmd/codedb-lens-com
          env: [GOOS=windows, GOARCH=amd64, CGO_ENABLED=0]
  - id: linux
    main: ./cmd/codedb-lens
    binary: codedb-lens
    goos: [linux]
    goarch: [amd64, arm64]
    env: [CGO_ENABLED=0]
    ldflags: ["-s -w -X main.version={{ .Version }}"]

archives:
  - id: windows
    ids: [windows]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}" # no version: releases/latest/download/<name> links stay valid
    formats: [zip]
    files: [LICENSE, README.md, README.pt-BR.md, {src: build/windows/codedb-lens.com, strip_parent: true}]
  - id: linux
    ids: [linux]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files: [LICENSE, README.md, README.pt-BR.md]

checksum:
  name_template: checksums.txt
  algorithm: sha256

# checksums.txt is signed by the release workflow (tools/sign), not here: GoReleaser hides the key from sign commands.

changelog:
  use: github
  sort: asc

release:
  draft: true   # review, attach the installer, then publish

nfpms:
  - package_name: codedb-lens
    ids: [linux]
    formats: [deb, rpm]
    vendor: codeDB
    maintainer: codeDB <suporte@codedb.com.br>
    homepage: https://lens.codedb.com.br/
    license: Apache-2.0
    description: Free, read-only health check for SQL Server and PostgreSQL.

# The ghcr.io image is built by the release workflow on Linux (this run is on Windows), see Dockerfile.

# Scoop (bucket/ in this repo) and winget are updated by .github/workflows/publish.yml once the draft is published.
# After Windows code signing: consider chocolateys (its moderation flags unsigned binaries).
# chocolateys:
#   - name: codedb-lens
#     title: codeDB Lens
#     authors: codeDB
#     license_url: https://github.com/codedb-io/codedb-lens/blob/main/LICENSE
