version: 2
project_name: codedb-lens

before:
  hooks:
    - go mod tidy
    - go generate ./cmd/codedb-lens   # Windows icon + manifest (.syso)

builds:
  - id: windows
    main: ./cmd/codedb-lens
    binary: codedb-lens
    goos: [windows]
    goarch: [amd64]
    tags: [desktop, production]
    env: [CGO_ENABLED=0]
    ldflags: ["-s -w -H windowsgui -X main.version={{ .Version }}"]
  - id: linux
    main: ./cmd/codedb-lens
    binary: codedb-lens
    goos: [linux]
    goarch: [amd64, arm64]
    env: [CGO_ENABLED=0]
    ldflags: ["-s -w -X main.version={{ .Version }}"]

archives:
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, README.md, README.pt-BR.md]

checksum:
  name_template: checksums.txt
  algorithm: sha256

# Ed25519 signature checked by `codedb-lens update` (public key in internal/update).
signs:
  - artifacts: checksum
    cmd: go
    args: ["run", "./tools/sign", "${artifact}"]
    signature: "${artifact}.sig"
    env: ["LENS_SIGNING_KEY={{ .Env.LENS_SIGNING_KEY }}"]   # sign commands only see env listed here

changelog:
  use: github
  sort: asc

release:
  draft: true   # review, attach the installer, then publish

